<style>
/* Layout: vista "Ruta" con tarjetas de los 10 módulos; vista de módulo con índice fijo a la izquierda
   (barra horizontal en móvil) + columna de lectura. El orden es un recorrido real de días, por eso se numera. */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --fg: #15222a; --muted: #5a6a73; --line: #d8e1e5;
  --accent: #1d5f86; --accent-soft: #e2edf4; --ok: #1d7a46; --ok-soft: #e1f2e7;
  --bad: #c0362c; --bad-soft: #fbe5e3; --idea: #f1ecdf; --idea-line: #c9a24a; --on-accent: #ffffff;
  /* Banda de marca (igual en ambos temas, como la imagen de LinkedIn) */
  --hero-bg: #0d2a3c; --hero-fg: #ffffff; --hero-muted: #b9cdd8; --hero-accent: #7cbbe0; --hero-line: rgba(255,255,255,.16); --hero-tile: rgba(255,255,255,.06);
  /* Colores por etapa de la ruta */
  --st-fund: #2a6ea6; --st-tools: #1f8a6d; --st-ia: #7048c2; --st-emp: #b86a12; --on-stage: #ffffff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1518; --surface: #162026; --fg: #e5edf0; --muted: #98a9b1; --line: #29383f;
    --accent: #7cbbe0; --accent-soft: #1a3140; --ok: #5fd08d; --ok-soft: #163325;
    --bad: #ff8a7f; --bad-soft: #3a1d1b; --idea: #2a2618; --idea-line: #c9a24a; --on-accent: #0e1518; --st-fund: #7cb6e6; --st-tools: #5fcfae; --st-ia: #b49cf2; --st-emp: #f0aa55; --on-stage: #0e1518;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1518; --surface: #162026; --fg: #e5edf0; --muted: #98a9b1; --line: #29383f;
  --accent: #7cbbe0; --accent-soft: #1a3140; --ok: #5fd08d; --ok-soft: #163325;
  --bad: #ff8a7f; --bad-soft: #3a1d1b; --idea: #2a2618; --idea-line: #c9a24a; --on-accent: #0e1518; --st-fund: #7cb6e6; --st-tools: #5fcfae; --st-ia: #b49cf2; --st-emp: #f0aa55; --on-stage: #0e1518;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: var(--hero-bg); color: var(--hero-fg); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--hero-line) 1px, transparent 1px), linear-gradient(90deg, var(--hero-line) 1px, transparent 1px); background-size: 48px 48px; opacity: .35; pointer-events: none; }
.hero::after { content: ""; position: absolute; inset: -40% -10% auto auto; width: 70%; height: 140%; background: radial-gradient(closest-side, rgba(124,187,224,.22), transparent); pointer-events: none; }
.hero > .wrap { position: relative; z-index: 1; }
.hero a { color: var(--hero-accent); }
.hero .wrap { padding-block: 32px 26px; display: flex; flex-direction: column; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; }
.crumbs a { text-decoration: none; font-weight: 500; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero .eyebrow { color: var(--hero-accent); display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #5fd08d; display: inline-block; }
.hero h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.02; font-weight: 800; max-width: 18ch; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--hero-accent); }
.hero p { margin: 0; color: var(--hero-muted); max-width: 60ch; }
.hero .chip { background: var(--hero-tile); color: var(--hero-fg); border: 1px solid var(--hero-line); }
.hero .track { background: rgba(255,255,255,.14); }
.hero .progress span { color: var(--hero-muted); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); }
.progress { display: flex; align-items: center; gap: 12px; max-width: 520px; }
.track { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 0; }
.fill { height: 100%; width: 0; background: var(--ok); transition: width .35s ease; }
.progress span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Vista Ruta */
.overview { padding-block: 32px 72px; display: flex; flex-direction: column; gap: 24px; }
.mods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.mod { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: start; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; transition: border-color .15s; }
.mod:hover { border-color: var(--accent); }
.mod-num { grid-row: span 3; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.6ch; }
.mod.done .mod-num { color: var(--ok); }
.mod h2 { font-size: 19px; line-height: 1.25; }
.mod p { margin: 0; font-size: 14px; color: var(--muted); }
.mod .track { height: 5px; margin-top: 6px; }
.note { font-size: 14px; color: var(--muted); max-width: 70ch; margin: 0; }

/* Vista Módulo */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-block: 32px 72px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.toc-title { font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.toc button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--fg); background: none; border: 0; text-align: left; font-size: 14px; cursor: pointer; }
.toc button:hover { background: var(--accent-soft); }
.dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.dot svg { width: 11px; height: 11px; opacity: 0; }
.toc button.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.toc button.done .dot svg { opacity: 1; }
.content { display: flex; flex-direction: column; gap: 28px; max-width: 700px; min-width: 0; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 80px; }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.block-head h2 { font-size: 22px; line-height: 1.2; }
.kicker { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.days { font-size: 13px; color: var(--muted); white-space: nowrap; }
.block p { margin: 0; }
.goals { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.step b { font-family: var(--font-display); font-size: 16px; }
.step span { font-size: 14px; color: var(--muted); }
.res { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--fg); background: var(--bg); transition: border-color .15s, background .15s; }
.res:hover { border-color: var(--accent); background: var(--accent-soft); }
.res-icon { flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.res-icon.video { background: var(--bad-soft); color: var(--bad); }
.res-icon svg { width: 20px; height: 20px; }
.res-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.res-type { font-size: 12px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em; }
.res-title { font-weight: 500; }
.res-go { flex: none; color: var(--muted); }
.novideo { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.idea { background: var(--idea); border-left: 3px solid var(--idea-line); border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 15px; }
.check { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font-size: 14px; font-weight: 500; color: var(--fg); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px 8px 10px; cursor: pointer; }
.check:hover { border-color: var(--ok); }
.check .box { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.check .box svg { width: 12px; height: 12px; opacity: 0; }
.check[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }
.check[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.check[aria-pressed="true"] .box svg { opacity: 1; }
.prompts { display: flex; flex-direction: column; gap: 10px; }
.prompt { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.prompt p { flex: 1; min-width: 0; font-size: 15px; font-style: italic; }
.copy { flex: none; font-size: 13px; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.warn { font-size: 15px; color: var(--muted); }
.qbar { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qbar .track { height: 6px; }
.qbar .fill { background: var(--accent); }
.q { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.q-head { display: flex; gap: 12px; align-items: baseline; }
.q-num { font-family: var(--font-mono); font-size: 13px; color: var(--accent); flex: none; }
.q-text { font-weight: 500; min-width: 0; }
.data { font-family: var(--font-mono); font-size: 14px; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--fg); text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.letter { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; border: 1.5px solid var(--line); color: var(--muted); }
.opt-text { flex: 1; min-width: 0; }
.mark { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.mark svg { width: 16px; height: 16px; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ok .mark { background: var(--ok); color: var(--surface); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-bad .mark { background: var(--bad); color: var(--surface); }
.opt.is-answer { border-color: var(--ok); border-style: dashed; }
.opt.is-dim { opacity: .55; }
.feedback { font-size: 15px; padding: 12px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--bad); }
.final { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.score { font-family: var(--font-display); font-size: 44px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.score span { font-size: 20px; color: var(--muted); font-weight: 600; }
.btn { font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-block; }
.context { background: var(--bg); border-radius: 10px; padding: 14px 16px; font-size: 15px; }
.tasks { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.tasks li::marker { font-family: var(--font-mono); color: var(--accent); }
code { font-family: var(--font-mono); font-size: 13.5px; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.sqlbox { position: relative; }
.sqlbox pre { margin: 0; max-height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.sqlbox .copy { position: absolute; top: 8px; right: 8px; }
.criteria { display: flex; flex-direction: column; gap: 8px; }
.criteria label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.criteria input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--ok); flex: none; }
h3 { font-size: 17px; }
.next { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 20px 24px; text-decoration: none; }
.next b { font-family: var(--font-display); font-size: 18px; }
.next span { font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); }
.support { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.support img { width: 100%; max-width: 220px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: block; }
.support h2 { font-size: 20px; margin-bottom: 6px; }
.support p { margin: 0 0 8px; font-size: 15px; }
.support .small { font-size: 13px; color: var(--muted); }
.hero .wrap.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: start; }
.stage-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--stage); color: var(--on-stage); }
.title-row { display: flex; align-items: center; gap: 16px; }
.mod-icon { flex: none; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--hero-tile); border: 1px solid var(--hero-line); color: var(--hero-accent); }
.mod-icon svg { width: 28px; height: 28px; }
/* Apoyo compacto en la cabecera */
.qr-mini { display: flex; align-items: center; gap: 12px; width: 250px; background: var(--hero-tile); border: 1px solid var(--hero-line); border-radius: 14px; padding: 12px; }
.qr-mini img { width: 76px; height: auto; border-radius: 8px; background: #fff; display: block; flex: none; }
.qr-mini b { font-family: var(--font-display); font-size: 15px; display: block; color: var(--hero-fg); }
.qr-mini span { font-size: 12.5px; color: var(--hero-muted); line-height: 1.35; display: block; }
/* Portada */
.hero .wrap.hero-ov { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: center; padding-block: 48px 44px; }
.hero-ov .hero-main { gap: 18px; }
.author-text { display: flex; flex-direction: column; align-items: inherit; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 640px; }
.stat { background: var(--hero-tile); border: 1px solid var(--hero-line); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 6px; font-size: 12.5px; color: var(--hero-muted); line-height: 1.3; }
.stat.free b { color: #5fd08d; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn.hero-btn { background: var(--hero-accent); color: var(--hero-bg); font-size: 16px; padding: 12px 20px; border-radius: 10px; }
.btn.hero-ghost { font-size: 15px; background: transparent; color: var(--hero-fg); border: 1.5px solid var(--hero-line); padding: 11px 18px; border-radius: 10px; }
.hero-progress { font-size: 14px; color: var(--hero-muted); }
.hero-progress b { color: var(--hero-fg); font-variant-numeric: tabular-nums; }
.author { background: var(--hero-tile); border: 1px solid var(--hero-line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.author img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 3px solid var(--hero-accent); display: block; }
.author b { font-family: var(--font-display); font-size: 20px; line-height: 1.2; }
.author p { font-size: 14px; line-height: 1.45; }
.author .btn { font-size: 14px; padding: 8px 14px; }
.author-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--hero-accent); }
/* Recorrido por etapas */
.section-title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.section-title h2 { font-size: clamp(24px, 4vw, 30px); }
.section-title p { margin: 0; color: var(--muted); font-size: 15px; }
.endpoint { display: flex; align-items: center; gap: 16px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1.5px dashed var(--accent); border-radius: 14px; padding: 16px 20px; transition: background .15s; }
.endpoint:hover { background: var(--accent-soft); }
.endpoint .tl-node { background: var(--accent); }
.endpoint b { font-family: var(--font-display); font-size: 18px; display: block; }
.endpoint span.sub { font-size: 14px; color: var(--muted); }
.endpoint .go { margin-left: auto; color: var(--accent); font-weight: 600; white-space: nowrap; }
.stage { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; border-top: 4px solid var(--stage); }
.stage-head { display: flex; flex-direction: column; gap: 8px; }
.stage-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--stage); }
.stage-head h3 { font-size: 22px; line-height: 1.15; }
.stage-head p { margin: 0; font-size: 14.5px; color: var(--muted); }
.stage-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.stage-bar i { display: block; height: 100%; background: var(--stage); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
.tl::before { content: ""; position: absolute; left: 19px; top: 20px; bottom: 20px; width: 2px; background: var(--line); }
.tl-item { position: relative; display: grid; grid-template-columns: 40px 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-decoration: none; color: var(--fg); padding: 10px 12px 10px 0; border-radius: 12px; transition: background .15s; }
.tl-item:hover { background: var(--bg); }
.tl-node { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--on-stage); background: var(--stage); box-shadow: 0 0 0 4px var(--surface); position: relative; z-index: 1; font-variant-numeric: tabular-nums; }

.tl-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--stage); background: var(--bg); border: 1px solid var(--line); }
.tl-icon svg { width: 20px; height: 20px; }
.tl-body { min-width: 0; display: flex; flex-direction: column; }
.tl-body b { font-family: var(--font-display); font-size: 17px; line-height: 1.25; }
.tl-body span { font-size: 13.5px; color: var(--muted); }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.going { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.trust { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.trust div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.trust b { font-family: var(--font-display); font-size: 17px; }
.trust span { font-size: 14px; color: var(--muted); }
.trust svg { width: 22px; height: 22px; color: var(--accent); }
/* Pie de página */
.site-foot { border-top: 1px solid var(--line); background: var(--surface); margin-top: 8px; }
.site-foot .wrap { padding-block: 24px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.foot-who { display: flex; align-items: center; gap: 12px; }
.foot-who img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block; }
.foot-who b { display: block; font-size: 15px; }
.foot-who span { font-size: 13px; color: var(--muted); }
.foot-links { display: flex; gap: 16px; font-size: 14px; font-weight: 500; }
.foot-note { width: 100%; font-size: 12.5px; color: var(--muted); margin: 0; }
/* Barra inferior en celular */
.bottombar { display: none; }
.hero-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qr-badge { width: 168px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.qr-badge img { width: 140px; height: auto; border-radius: 8px; background: #fff; display: block; }
.qr-badge b { font-family: var(--font-display); font-size: 15px; line-height: 1.2; }
.qr-badge span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.mod.intro { grid-column: 1 / -1; background: var(--accent-soft); border-color: var(--accent); }
.mod.intro .mod-num { color: var(--accent); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.howto .step svg { width: 22px; height: 22px; color: var(--accent); }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.post { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 15px; margin: 0; }
.postbox { position: relative; display: flex; flex-direction: column; gap: 10px; }
.quote { background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
.quote p { margin: 0; font-family: var(--font-display); font-size: clamp(20px, 3.6vw, 26px); line-height: 1.3; font-weight: 700; text-wrap: balance; }
.quote span { font-size: 15px; opacity: .9; }
.modlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 0; }
  nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; flex-direction: row; overflow-x: auto; gap: 4px; padding-block: 10px; background: var(--bg); border-bottom: 1px solid var(--line); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .toc-title { display: none; }
  .toc button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; }
  .content { max-width: none; }
  .mods { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 960px) {
  .hero .wrap.hero-ov { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 36px; }
  .author { flex-direction: row; text-align: left; align-items: center; }
  .author img { width: 72px; height: 72px; }
  .author .author-text { align-items: flex-start; gap: 4px; }
  .stage { grid-template-columns: minmax(0, 1fr); gap: 18px; }
}
@media (max-width: 860px) {
  .bottombar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bottombar a { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent); }
  .bottombar a:last-child { text-align: right; }
  .bottombar span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .has-bottombar { padding-bottom: 72px; }
}
@media (max-width: 640px) {
  .hero .wrap.hero-grid { grid-template-columns: minmax(0, 1fr); }
  .qr-mini { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trust { grid-template-columns: minmax(0, 1fr); }
  .tl-item { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .tl-icon { display: none; }
  .title-row { gap: 12px; }
  .mod-icon { width: 44px; height: 44px; border-radius: 12px; }
  .mod-icon svg { width: 22px; height: 22px; }
  .endpoint .go { display: none; }
  .foot-links { width: 100%; }
}
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } .block { padding: 18px; } .support { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ===================== Estilo B: claro, aireado, con navegación lateral ===================== */
:root {
  --bg: #f5f8fc; --surface: #ffffff; --fg: #17212b; --muted: #556270; --line: #dfe6ee;
  --accent: #1b64a8; --accent-soft: #dceaf8; --on-accent: #ffffff; --blob: #e4eef9;
  --grad-a: #2a6ea6; --grad-b: #7048c2;
  --font-display: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --hero-bg: transparent; --hero-fg: var(--fg); --hero-muted: var(--muted); --hero-accent: var(--accent); --hero-line: var(--line); --hero-tile: var(--surface);
  --bar-h: 64px; --rail-w: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f151b; --surface: #182129; --fg: #e6edf3; --muted: #9aabb8; --line: #2a3640; --accent: #8cc3f0; --accent-soft: #1b3346; --on-accent: #0f151b; --blob: #16222d; --grad-a: #8cc3f0; --grad-b: #b49cf2; }
}
:root[data-theme="dark"] { --bg: #0f151b; --surface: #182129; --fg: #e6edf3; --muted: #9aabb8; --line: #2a3640; --accent: #8cc3f0; --accent-soft: #1b3346; --on-accent: #0f151b; --blob: #16222d; --grad-a: #8cc3f0; --grad-b: #b49cf2; }
body { font-size: 16px; }
h1, h2, h3 { font-weight: 600; letter-spacing: -.01em; }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar-h); display: flex; align-items: center; gap: 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font-weight: 600; font-size: 18px; white-space: nowrap; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; display: block; flex: none; }
.brand span b { color: var(--accent); font-weight: 700; }
.search { flex: 1; max-width: 440px; margin-inline: auto; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; height: 44px; }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: var(--fg); outline: none; }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.pill-btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; text-decoration: none; border-radius: 999px; padding: 10px 20px; border: 0; cursor: pointer; }
.pill-btn.primary { background: var(--accent); color: var(--on-accent); }
.pill-btn.text { background: transparent; color: var(--accent); padding-inline: 12px; }
.pill-btn.tonal { background: var(--accent-soft); color: var(--accent); }

/* Menú lateral */
.rail { position: fixed; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: var(--rail-w); z-index: 20; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 6px calc(16px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.rail a, .rail button { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 500; background: none; border: 0; cursor: pointer; padding: 6px 0; }
.rail i { width: 56px; height: 32px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
.rail svg { width: 22px; height: 22px; }
.rail a:hover i, .rail button:hover i { background: var(--bg); }
.rail a.on { color: var(--accent); }
.rail a.on i { background: var(--accent-soft); color: var(--accent); }
.shell { padding-left: var(--rail-w); position: relative; overflow-x: clip; }
.shell::before, .shell::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; background: var(--blob); pointer-events: none; }
.shell::before { width: 620px; height: 520px; top: -160px; right: -180px; }
.shell::after { width: 460px; height: 420px; top: 900px; left: 40px; }
#app { position: relative; z-index: 1; }

/* Encabezado de la portada */
.ov-hero { text-align: center; padding-block: 64px 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.ov-hero h1 { font-size: clamp(38px, 7vw, 68px); line-height: 1.04; font-weight: 600; letter-spacing: -.025em; max-width: 16ch; }
.grad { background: linear-gradient(90deg, var(--grad-a), var(--grad-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ov-hero p { margin: 0; color: var(--muted); max-width: 64ch; font-size: 17px; }
.ov-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.ov-badges span { font-size: 14px; font-weight: 500; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.ov-badges b { color: var(--accent); }
.ov-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.ov-progress { font-size: 14px; color: var(--muted); }

/* Filtros por etapa */
.filters { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding-block: 12px 28px; }
.filter { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 104px; padding: 10px 8px 8px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.filter svg { width: 26px; height: 26px; color: var(--stage, var(--fg)); }
.filter:hover { color: var(--fg); }
.filter[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--stage, var(--accent)); }

/* Tarjetas de módulos */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; max-width: 960px; margin-inline: auto; }
.card { display: flex; flex-direction: column; gap: 14px; min-height: 250px; text-decoration: none; color: var(--fg); background: var(--surface); border-radius: 26px; padding: 24px 24px 20px; border: 1px solid var(--line); transition: box-shadow .2s, transform .2s; }
.card:hover { box-shadow: 0 10px 30px rgba(20, 50, 80, .12); transform: translateY(-2px); }
.card-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: var(--bg); color: var(--fg); }
.card-chip svg { width: 15px; height: 15px; color: var(--stage); }
.card h3 { font-size: 24px; line-height: 1.2; font-weight: 500; }
.card p { margin: 0; font-size: 15px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-meta { font-size: 13.5px; color: var(--muted); }
.card-meta b { color: var(--fg); font-weight: 600; }
.arrow { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); transition: background .15s, color .15s; }
.arrow svg { width: 20px; height: 20px; }
.card:hover .arrow { background: var(--accent); color: var(--on-accent); }
.card.feature { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 20px; background: linear-gradient(120deg, var(--accent-soft), var(--surface)); }
.card.feature-cert { position: relative; overflow: hidden; border: 0; color: #2b1700; background: linear-gradient(115deg, #ffc93c 0%, #ff9f1c 55%, #ff7a1a 100%); box-shadow: 0 10px 28px rgba(255, 140, 26, .35); }
.card.feature-cert::after { content: ""; position: absolute; top: -40%; left: -30%; width: 40%; height: 180%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: rotate(18deg); animation: cert-shine 4.5s ease-in-out infinite; pointer-events: none; }
@keyframes cert-shine { 0%, 60% { left: -40%; } 100% { left: 130%; } }
.card.feature-cert:hover { box-shadow: 0 14px 34px rgba(255, 140, 26, .5); }
.card.feature-cert h3 { font-weight: 700; color: #2b1700; }
.card.feature-cert p { color: #4a2c05; }
.card.feature-cert .card-chip { background: rgba(255,255,255,.75); color: #2b1700; }
.card.feature-cert .card-chip svg { color: #c25e00; }
.card.feature-cert .arrow { background: #2b1700; color: #ffc93c; }
.card.feature-cert:hover .arrow { background: #fff; color: #c25e00; }
@media (prefers-reduced-motion: reduce) { .card.feature-cert::after { animation: none; display: none; } }
.card.feature .feature-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card .mini-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; width: 100%; }
.card .mini-bar i { display: block; height: 100%; background: var(--stage, var(--ok)); }
.empty { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 24px; }

/* Sección del autor */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 40px; align-items: center; max-width: 960px; margin: 64px auto 0; }
.about h2 { font-size: clamp(32px, 5vw, 48px); line-height: 1.08; font-weight: 600; letter-spacing: -.02em; }
.about p { color: var(--muted); font-size: 17px; margin: 14px 0 0; }
.about-card { background: var(--surface); border-radius: 28px; border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.about-card img { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent-soft); }
.about-card b { font-size: 22px; font-weight: 600; }
.about-card span { font-size: 15px; color: var(--muted); }
.about-list { display: grid; gap: 10px; margin-top: 18px; padding: 0; list-style: none; }
.about-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
.about-list svg { width: 22px; height: 22px; color: var(--accent); flex: none; margin-top: 1px; }
.ov-support { max-width: 960px; margin: 48px auto 0; }
.ov-wrap { padding-bottom: 72px; }

/* Ajustes de las vistas de módulo con el estilo B */
.hero::before, .hero::after { display: none; }
.hero { background: transparent; border-bottom: 0; }
.hero h1 { font-weight: 600; letter-spacing: -.02em; }
.hero h1 em { color: var(--accent); }
.mod-icon { background: var(--accent-soft); border: 0; color: var(--accent); border-radius: 16px; }
.hero .chip { background: var(--surface); }
.hero .track { background: var(--line); }
.qr-mini { background: var(--surface); border-radius: 20px; }
.qr-mini img { border: 1px solid var(--line); }
.block, .support, .stage { border-radius: 24px; }
.res, .prompt, .step, .context, .sqlbox pre, .post { border-radius: 16px; }
.btn { border-radius: 999px; }
.next { border-radius: 24px; }
nav.toc { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 24px); }
.block { scroll-margin-top: calc(var(--bar-h) + 24px); }
.site-foot { position: relative; z-index: 1; }

@media (max-width: 1000px) {
  .rail { display: none; }
  .shell { padding-left: 0; }
}
@media (max-width: 860px) {
  nav.toc { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 720px) {
  .topbar { position: relative; top: 0; height: auto; flex-wrap: wrap; padding-block: 10px; row-gap: 10px; }
  .brand { font-size: 16px; }
  .brand-mark { width: 28px; height: 28px; }
  .search { order: 3; max-width: none; flex-basis: 100%; height: 40px; }
  .top-actions .text { display: none; }
  .top-actions .primary { padding: 8px 14px; font-size: 14px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { min-height: 0; border-radius: 22px; }
  .card.feature { flex-direction: column; align-items: flex-start; }
  .about { grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 44px; }
  .ov-hero { padding-top: 36px; }
  .filters { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .filter { min-width: 92px; }
  nav.toc { top: env(safe-area-inset-top, 0px); }
  .block { scroll-margin-top: 70px; }
}

/* Lectura y video dentro de la página */
.reading { border: 1px solid var(--line); border-radius: 20px; background: var(--bg); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.reading-head { display: flex; align-items: center; gap: 12px; }
.reading-head div { display: flex; flex-direction: column; }
.reading-head b { font-size: 17px; font-weight: 600; }
.reading-body { display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.65; max-width: 68ch; }
.reading-body p { margin: 0; }
.reading-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.reading-body code { font-size: 13.5px; }
.reading-note { margin: 0; font-size: 14px; color: var(--muted); }
.reading-cta { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.reading-cta p { margin: 0; font-size: 15px; line-height: 1.5; max-width: 68ch; }
.reading-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 20px; border-radius: 999px; box-shadow: 0 4px 14px rgba(29,95,134,.28); transition: transform .15s, box-shadow .15s; }
.reading-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29,95,134,.36); color: var(--on-accent); }
.reading-btn svg { width: 18px; height: 18px; flex: none; }
.reading-src { font-size: 14px; color: var(--muted); }
.reading-src b { color: var(--fg); font-weight: 600; }
@media (max-width: 560px) { .reading-btn { align-self: stretch; justify-content: center; } }

@keyframes dati-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

'1-1': `<p>Un analista de datos convierte datos en decisiones. Su trabajo diario combina tres cosas: entender la pregunta del negocio, preparar los datos (buscarlos, limpiarlos y unirlos) y comunicar lo que encontró de forma clara.</p>
<p>No todos los análisis buscan lo mismo. Se suelen clasificar en cuatro tipos, según la pregunta que responden:</p>
<ul><li><b>Descriptivo:</b> ¿qué pasó? Por ejemplo, cuánto se vendió el mes pasado.</li><li><b>Diagnóstico:</b> ¿por qué pasó? Por ejemplo, qué explica una caída de ventas.</li><li><b>Predictivo:</b> ¿qué podría pasar? Por ejemplo, cuánto se venderá el próximo trimestre.</li><li><b>Prescriptivo:</b> ¿qué deberíamos hacer? Por ejemplo, a qué clientes enviar una promoción.</li></ul>
<p>Un analista junior trabaja sobre todo en lo descriptivo y lo diagnóstico. Dominar esos dos es la base para todo lo demás.</p>`,
'1-2': `<p>Un buen análisis empieza antes de abrir Excel: empieza con una buena pregunta. Una pregunta vaga como "¿cómo van las ventas?" no se puede responder con precisión. Una pregunta específica sí: "¿qué categoría redujo más sus ventas este trimestre frente al anterior?".</p>
<p>Para medir el avance de un negocio se usan los <b>KPIs</b> (indicadores clave de rendimiento). Un buen KPI cumple el método <b>SMART</b>:</p>
<ul><li><b>Específico:</b> mide una sola cosa.</li><li><b>Medible:</b> tiene un número.</li><li><b>Alcanzable</b> y <b>relevante</b> para el objetivo del negocio.</li><li><b>Con plazo:</b> dice para cuándo.</li></ul>
<p>Ejemplo: "Aumentar la tasa de recompra de 20% a 25% antes de diciembre". Pocos KPIs bien definidos valen más que muchos indicadores que nadie revisa.</p>`,
'1-3': `<p>La estadística descriptiva resume muchos datos en pocos números que se pueden entender rápido. Se divide en dos grupos de medidas.</p>
<p><b>Medidas de tendencia central</b> (el valor "típico"):</p>
<ul><li><b>Media:</b> el promedio. Es sensible a valores extremos.</li><li><b>Mediana:</b> el valor del medio cuando ordenas los datos. No se deja arrastrar por los extremos.</li><li><b>Moda:</b> el valor que más se repite.</li></ul>
<p><b>Medidas de dispersión</b> (qué tan separados están los datos):</p>
<ul><li><b>Rango:</b> máximo menos mínimo.</li><li><b>Desviación estándar:</b> cuánto se alejan, en promedio, los datos de la media.</li></ul>
<p>Regla práctica: si la media y la mediana son muy distintas, hay valores extremos. En ese caso, la mediana describe mejor el caso típico, como pasa con los sueldos.</p>`,
'1-4': `<p>Una distribución de probabilidad describe cómo se reparten los valores posibles de una variable y qué tan probable es cada uno. Conocerlas ayuda a saber qué es "normal" en tus datos y qué es raro.</p>
<p>La más usada es la <b>distribución normal</b>, con forma de campana: la mayoría de los datos se agrupa cerca del promedio y pocos quedan en los extremos. Estaturas, tiempos de entrega o errores de medición suelen comportarse así.</p>
<p>La <b>regla 68-95-99.7</b> resume la normal: cerca del 68% de los datos está a 1 desviación estándar del promedio, el 95% a 2 y el 99.7% a 3.</p>
<p>Otras distribuciones frecuentes son la <b>binomial</b> (éxitos en varios intentos, como compras sobre visitas), la <b>Poisson</b> (eventos por periodo, como reclamos por día) y la <b>uniforme</b> (todos los valores igual de probables).</p>`,
'2-1': `<p>Excel sigue siendo la herramienta que más piden las ofertas de analista. Antes de analizar, conviene trabajar ordenado: convierte tus datos en <b>tabla</b> con Ctrl + T. Así las fórmulas se extienden solas y los filtros quedan listos.</p>
<p>Funciones que usarás todos los días:</p>
<ul><li><b>SUMA, PROMEDIO, CONTAR</b> y sus versiones con condición: <b>SUMAR.SI.CONJUNTO</b> y <b>CONTAR.SI.CONJUNTO</b>.</li><li><b>SI</b> para crear reglas, por ejemplo marcar ventas mayores a una meta.</li><li><b>BUSCARX</b> para traer datos de otra tabla. Reemplaza a BUSCARV: busca en cualquier dirección y permite indicar qué mostrar si no encuentra el valor.</li></ul>
<p>Ejemplo: <code>=BUSCARX(A2; Clientes[ID]; Clientes[Ciudad]; "Sin dato")</code> trae la ciudad de cada cliente desde la tabla Clientes.</p>`,
'2-2': `<p><b>Power Query</b> es la herramienta de Excel para importar y limpiar datos sin copiar y pegar. Puede leer archivos de Excel, CSV, carpetas completas o bases de datos.</p>
<p>Su gran ventaja: <b>guarda cada paso</b> de limpieza (quitar columnas, cambiar tipos de datos, separar textos, eliminar duplicados, combinar tablas). El próximo mes solo pulsas <b>Actualizar</b> y los mismos pasos se aplican a los datos nuevos.</p>
<p>Pasos de limpieza más comunes:</p>
<ul><li>Revisar que cada columna tenga el tipo correcto (fecha, número o texto).</li><li>Quitar filas vacías y duplicados.</li><li>Unificar textos, por ejemplo "LIMA", "lima" y "Lima ".</li><li>Combinar tablas con <b>Combinar consultas</b>, similar a un JOIN en SQL.</li></ul>
<p>Si un reporte se repite cada semana o cada mes, Power Query te ahorra horas.</p>`,
'2-3': `<p>Una <b>tabla dinámica</b> resume miles de filas en segundos y te deja cambiar la vista arrastrando campos. Es la forma más rápida de responder preguntas de negocio en Excel.</p>
<p>Tiene cuatro áreas:</p>
<ul><li><b>Filas:</b> las categorías que quieres listar, como región o producto.</li><li><b>Columnas:</b> una segunda categoría para cruzar, como el mes.</li><li><b>Valores:</b> la métrica que se calcula, como la suma de ventas.</li><li><b>Filtros:</b> para mirar solo una parte de los datos.</li></ul>
<p>Trucos útiles: en Valores puedes cambiar la suma por promedio o conteo, y mostrar los resultados como <b>% del total</b>. Agrega <b>segmentaciones</b> para filtrar con botones y una <b>escala de tiempo</b> para fechas. Si cambian los datos de origen, recuerda pulsar Actualizar.</p>`,
'2-4': `<p>Un <b>dashboard</b> es una vista de una sola pantalla con los indicadores que alguien necesita para decidir. No es un collage de gráficos: cada elemento debe responder una pregunta concreta de quien lo va a usar.</p>
<p>Antes de diseñarlo, define tres cosas: ¿quién lo usa?, ¿qué decisión toma con él? y ¿cada cuánto lo revisa?</p>
<p>Buenas prácticas:</p>
<ul><li>Arriba, los <b>3 a 5 indicadores clave</b> con su comparación (frente a la meta o al periodo anterior).</li><li>Al centro, la <b>tendencia</b> en el tiempo.</li><li>Abajo, el <b>detalle</b> por categoría.</li><li>Usa el color con intención: un color para lo importante y gris para lo demás.</li><li>Elige el gráfico según la pregunta: líneas para el tiempo, barras para comparar categorías.</li></ul>`,
'2-5': `<p>La IA puede ayudarte a trabajar más rápido en Excel, sobre todo para <b>crear y explicar fórmulas</b>, proponer formas de limpiar datos y sugerir qué analizar.</p>
<p>Para obtener buenas respuestas, dale contexto: los nombres de las columnas, 3 a 5 filas de ejemplo (inventadas o sin datos sensibles) y el resultado que esperas.</p>
<p>Ejemplo de pedido: <i>"Tengo una tabla con Fecha, Región y Ventas. Dame la fórmula de Excel en español para sumar las ventas de la región Norte en marzo."</i></p>
<p>Ten en cuenta:</p>
<ul><li>En Excel en español las funciones van en español y los argumentos se separan con punto y coma. Pide la fórmula así.</li><li>Prueba siempre la fórmula con un caso cuyo resultado ya conozcas.</li><li>Copilot dentro de Excel requiere una suscripción de Microsoft 365; Claude o ChatGPT sirven para crear fórmulas aunque no la tengas.</li></ul>`,
'3-1': `<p><b>SQL</b> es el lenguaje para consultar bases de datos. Las empresas guardan sus datos en tablas relacionadas (clientes, productos, ventas) y SQL te permite pedir exactamente lo que necesitas.</p>
<p>La estructura básica de una consulta:</p>
<p><code>SELECT columnas FROM tabla WHERE condición ORDER BY columna;</code></p>
<ul><li><b>SELECT</b> elige las columnas.</li><li><b>FROM</b> indica la tabla.</li><li><b>WHERE</b> filtra las filas.</li><li><b>ORDER BY</b> ordena el resultado (ASC o DESC).</li></ul>
<p>Para resumir se usan funciones de agregación: <b>COUNT</b>, <b>SUM</b>, <b>AVG</b>, <b>MIN</b> y <b>MAX</b>.</p>
<p>Un consejo: aunque se escribe empezando por SELECT, la base de datos la ejecuta en otro orden: primero FROM, luego WHERE, GROUP BY, SELECT y al final ORDER BY. Entender ese orden evita muchos errores.</p>`,
'3-2': `<p>En el trabajo real casi nunca consultas una sola tabla. Para combinarlas se usa <b>JOIN</b>, uniendo por una columna en común (por ejemplo, <code>ventas.cliente_id = clientes.id</code>).</p>
<ul><li><b>INNER JOIN:</b> solo las filas que coinciden en ambas tablas.</li><li><b>LEFT JOIN:</b> todas las filas de la tabla izquierda, aunque no tengan pareja. Sirve, por ejemplo, para encontrar clientes sin compras.</li></ul>
<p>Para resumir por categoría se usa <b>GROUP BY</b>: <code>SELECT ciudad, SUM(monto) FROM ventas GROUP BY ciudad;</code>. Para filtrar grupos se usa <b>HAVING</b>, no WHERE: <code>HAVING SUM(monto) &gt; 1000</code>.</p>
<p>Una <b>subconsulta</b> es una consulta dentro de otra. Ejemplo: listar las ventas mayores al promedio con <code>WHERE monto &gt; (SELECT AVG(monto) FROM ventas)</code>. Cuando una consulta se vuelve larga, las <b>CTE</b> (<code>WITH</code>) ayudan a ordenarla por pasos.</p>`,
'3-3': `<p>En el día a día, un analista usa SQL para <b>traer y preparar los datos</b>: filtrar el periodo, unir tablas y resumir. Después, el análisis y la visualización suelen continuar en Excel, Python o Power BI.</p>
<p>¿Cuándo usar cada herramienta?</p>
<ul><li><b>SQL:</b> cuando los datos están en una base de datos o son demasiados para Excel (cientos de miles o millones de filas).</li><li><b>Excel:</b> para análisis rápidos, cálculos puntuales y compartir con áreas de negocio.</li></ul>
<p>Buenas prácticas que piden en las empresas:</p>
<ul><li>Escribe consultas legibles: una cláusula por línea y nombres claros.</li><li>Valida los resultados con un total conocido antes de presentarlos.</li><li>Guarda tus consultas: las reutilizarás más de lo que crees.</li><li>Usa la IA para explicar o revisar consultas, pero entiende cada línea antes de ejecutarla.</li></ul>`,
'4-1': `<p><b>Python</b> es el lenguaje de programación más usado en análisis y ciencia de datos. Es fácil de leer y tiene librerías para casi todo: limpiar datos, analizarlos, graficar y automatizar tareas.</p>
<p>Los conceptos básicos que necesitas:</p>
<ul><li><b>Variables y tipos de datos:</b> números, texto (str), booleanos, listas y diccionarios.</li><li><b>Condicionales</b> (<code>if</code>, <code>elif</code>, <code>else</code>) para tomar decisiones.</li><li><b>Bucles</b> (<code>for</code>, <code>while</code>) para repetir tareas.</li><li><b>Funciones</b> (<code>def</code>) para reutilizar código.</li></ul>
<p>Puedes practicar sin instalar nada con <b>Google Colab</b>, que funciona en el navegador (pide una cuenta de Google). Programar se aprende escribiendo: pausa el video y repite cada ejemplo.</p>`,
'4-2': `<p><b>pandas</b> es la librería de Python para trabajar con tablas, llamadas <b>DataFrames</b>. Es como un Excel que se controla con código, capaz de manejar muchos más datos.</p>
<p>Comandos esenciales:</p>
<ul><li><code>pd.read_csv("archivo.csv")</code> carga un archivo.</li><li><code>df.head()</code>, <code>df.info()</code> y <code>df.describe()</code> te muestran las primeras filas, los tipos y nulos, y un resumen estadístico.</li><li><code>df[df["ventas"] &gt; 100]</code> filtra filas.</li><li><code>df.groupby("categoria")["ventas"].sum()</code> resume por grupo, como una tabla dinámica.</li><li><code>df.merge(otra, on="id")</code> combina tablas, como un JOIN.</li></ul>
<p>Para limpiar: <code>dropna()</code> y <code>fillna()</code> manejan valores vacíos, y <code>drop_duplicates()</code> elimina duplicados.</p>`,
'4-3': `<p>El <b>análisis exploratorio de datos (EDA)</b> es el primer contacto serio con un dataset. Antes de sacar conclusiones, responde cuatro preguntas:</p>
<ul><li><b>¿Qué datos tengo?</b> Columnas, tipos y cantidad de filas.</li><li><b>¿Están completos?</b> Valores nulos y duplicados.</li><li><b>¿Hay valores raros?</b> Extremos o errores, como edades negativas.</li><li><b>¿Qué relaciones se ven?</b> Cómo cambia una variable según otra.</li></ul>
<p>Los gráficos ayudan mucho: el <b>histograma</b> muestra cómo se reparten los valores, el <b>diagrama de caja</b> revela extremos y el de <b>dispersión</b> muestra relaciones entre dos variables numéricas.</p>
<p>Un buen EDA termina con hipótesis claras para investigar, no con conclusiones apresuradas.</p>`,
'4-4': `<p>Los asistentes de IA escriben código rápido, pero eso no reemplaza entenderlo. Si no puedes explicar lo que hace tu código, no podrás detectar sus errores ni defenderlo en una entrevista.</p>
<p>Una forma sana de programar con IA:</p>
<ul><li><b>Primero intenta tú.</b> Usa la IA para revisar, no para empezar desde cero.</li><li><b>Pide explicaciones:</b> "explícame este código línea por línea".</li><li><b>Divide el problema</b> en pasos pequeños y pide ayuda en cada uno.</li><li><b>Prueba con datos pequeños</b> cuyo resultado ya conozcas.</li><li><b>Cuando haya un error,</b> pega el mensaje completo y pide primero la causa y luego la solución.</li></ul>
<p>Y una regla fija: no pegues datos personales ni confidenciales en una IA pública. Usa datos de ejemplo o anonimizados.</p>`,
'5-1': `<p><b>Power BI</b> es la herramienta de Microsoft para crear reportes y dashboards interactivos. <b>Power BI Desktop</b> es gratuito y se instala en Windows; solo necesitas una cuenta para publicar y compartir en línea.</p>
<p>El flujo de trabajo tiene cuatro pasos:</p>
<ul><li><b>Obtener datos:</b> de Excel, CSV, bases de datos y más.</li><li><b>Transformar:</b> con Power Query, el mismo que aprendiste en Excel.</li><li><b>Modelar:</b> relacionar tablas. Lo recomendado es el <b>modelo estrella</b>: una tabla de hechos (ventas) al centro y tablas de dimensiones (productos, clientes, fechas) alrededor.</li><li><b>Visualizar:</b> arrastrar campos a gráficos, tarjetas y tablas.</li></ul>
<p>Una tabla de fechas propia, relacionada con tus datos, te permitirá comparar periodos con facilidad.</p>`,
'5-2': `<p><b>DAX</b> es el lenguaje de fórmulas de Power BI. Se parece a las fórmulas de Excel, pero trabaja sobre tablas y columnas completas.</p>
<p>Lo más importante es distinguir dos cosas:</p>
<ul><li><b>Columna calculada:</b> se calcula fila por fila y se guarda en la tabla.</li><li><b>Medida:</b> se calcula al momento según los filtros del reporte. Para indicadores como ventas totales o margen, usa siempre medidas.</li></ul>
<p>Ejemplos:</p>
<ul><li><code>Ventas Totales = SUM(Ventas[Monto])</code></li><li><code>Ventas Lima = CALCULATE([Ventas Totales], Clientes[Ciudad] = "Lima")</code></li><li><code>Ventas Año Anterior = CALCULATE([Ventas Totales], SAMEPERIODLASTYEAR(Fechas[Fecha]))</code></li></ul>
<p><b>CALCULATE</b> es la función clave de DAX: evalúa una medida cambiando los filtros.</p>`,
'5-3': `<p>Un dashboard funciona cuando quien lo mira entiende el mensaje en pocos segundos. Para eso, combina diseño con <b>storytelling</b>: contar una historia con datos.</p>
<p>Principios de diseño:</p>
<ul><li>Ordena como se lee: indicadores arriba, tendencia al centro y detalle abajo.</li><li>Deja espacio en blanco y alinea los elementos.</li><li>Usa pocos colores: uno para destacar y grises para el contexto.</li><li>Pon títulos que digan la conclusión, por ejemplo "Las ventas del Sur cayeron 12%", en lugar de solo "Ventas por región".</li></ul>
<p>Para el storytelling, piensa en tres partes: el <b>contexto</b> (qué está pasando), el <b>hallazgo</b> (qué descubriste, con evidencia) y la <b>acción</b> (qué se debería hacer).</p>`,
'5-4': `<p>La IA ya forma parte de Power BI. <b>Copilot</b> (en las versiones con licencia que lo incluye) puede crear páginas de reporte, sugerir visuales y escribir medidas DAX a partir de una descripción en lenguaje natural.</p>
<p>También puedes usar asistentes como Claude o ChatGPT para:</p>
<ul><li>Escribir o corregir medidas DAX describiendo tus tablas y columnas.</li><li>Documentar el modelo: qué hace cada medida y de dónde vienen los datos.</li><li>Revisar el diseño de un dashboard y proponer mejoras.</li></ul>
<p>Con estándares como <b>MCP</b>, un asistente puede incluso conectarse al modelo para consultarlo directamente.</p>
<p>Lo que no cambia: tú decides si un indicador está bien definido para el negocio. Valida cada medida comparando su resultado con un total que ya conozcas.</p>`,
'6-1': `<p>Un <b>modelo de lenguaje grande (LLM)</b>, como los que usan Claude o ChatGPT, se entrena con enormes cantidades de texto para aprender patrones del lenguaje. Al responder, <b>predice el texto más probable</b>, palabra por palabra, según tu pedido y lo que aprendió.</p>
<p>Eso explica sus fortalezas y sus límites:</p>
<ul><li><b>Es muy bueno</b> resumiendo, redactando, explicando conceptos y escribiendo código.</li><li><b>Puede equivocarse con total seguridad.</b> Puede inventar cifras, fuentes o datos que suenan creíbles: son las llamadas <b>alucinaciones</b>.</li><li><b>Su conocimiento tiene una fecha de corte</b>, salvo que pueda buscar en internet o leer archivos que le des.</li></ul>
<p>Para un analista, la conclusión es clara: el LLM es un asistente muy capaz, pero las cifras se verifican siempre en la fuente.</p>`,
'6-2': `<p>La <b>ingeniería de prompts</b> es la habilidad de pedirle a una IA lo que necesitas de forma clara. Un buen prompt suele tener cuatro partes:</p>
<ul><li><b>Contexto:</b> quién eres y qué datos tienes. "Soy analista de una tienda online; tengo una tabla con fecha, producto y ventas."</li><li><b>Tarea:</b> qué quieres exactamente. "Propón 5 preguntas de negocio."</li><li><b>Formato:</b> cómo quieres la respuesta. "En una tabla, con el tipo de análisis de cada pregunta."</li><li><b>Ejemplo:</b> una muestra del resultado esperado.</li></ul>
<p>Otras técnicas útiles: dividir tareas grandes en pasos, pedirle que explique su razonamiento y que diga cuándo no está seguro, e <b>iterar</b>: si la respuesta no sirve, aclara el pedido en lugar de repetirlo igual.</p>`,
'6-3': `<p><b>Claude</b> es el asistente de IA de Anthropic. Tiene un plan gratuito y planes de pago, y para usarlo necesitas crear una cuenta.</p>
<p>Funciones útiles para un analista:</p>
<ul><li><b>Leer archivos:</b> puedes subir un CSV, un Excel o un PDF y hacerle preguntas sobre su contenido.</li><li><b>Analizar datos:</b> calcula resúmenes, detecta patrones y genera gráficos a partir de tus archivos.</li><li><b>Proyectos:</b> guardan documentos e instrucciones para que no tengas que repetir el contexto en cada conversación.</li><li><b>Redactar y revisar:</b> informes, correos y explicaciones de resultados.</li></ul>
<p>Una buena práctica: después de que Claude analice un archivo, revisa al menos dos cifras en el archivo original. Y no subas datos personales o confidenciales sin autorización de tu empresa.</p>`,
'6-4': `<p>La IA acelera casi todas las etapas de un análisis, siempre que tú mantengas el control.</p>
<ul><li><b>Preguntas:</b> pídele que proponga preguntas de negocio a partir de las columnas de tu tabla.</li><li><b>Limpieza:</b> que sugiera cómo tratar nulos, duplicados o textos desordenados.</li><li><b>Cálculo:</b> que escriba fórmulas de Excel, consultas SQL o código pandas, y que los explique.</li><li><b>Hallazgos:</b> que resuma resultados en lenguaje de negocio para un gerente.</li></ul>
<p>Tu valor como analista está en dos cosas que la IA no puede hacer por ti: <b>hacer la pregunta correcta</b> y <b>validar la respuesta</b>. Si la IA te da un 35% y tu cálculo da 25%, manda el dato verificado en la fuente.</p>`,
'7-1': `<p>Un <b>chatbot</b> responde preguntas. Un <b>agente de IA</b> va más allá: recibe un objetivo, <b>planifica pasos</b> y <b>usa herramientas</b> para cumplirlo. Por ejemplo, puede buscar información, consultar una base de datos, ejecutar código o enviar un correo.</p>
<p>Un agente combina tres elementos:</p>
<ul><li><b>Un modelo de lenguaje</b> que razona y decide el siguiente paso.</li><li><b>Herramientas</b> a las que tiene acceso.</li><li><b>Instrucciones y límites</b> que definen qué puede y qué no puede hacer.</li></ul>
<p>Para un analista, los agentes ya permiten automatizar reportes o responder preguntas sobre los datos de la empresa. El riesgo: un agente puede equivocarse en un paso y seguir adelante. Por eso se diseñan con permisos limitados y revisión humana en los puntos importantes.</p>`,
'7-2': `<p><b>n8n</b> es una herramienta para automatizar tareas conectando aplicaciones mediante "nodos", casi sin programar. Se puede instalar gratis en tu computadora; su versión en la nube es de pago y pide una cuenta.</p>
<p>Todo flujo tiene tres partes:</p>
<ul><li><b>Disparador:</b> cuándo empieza. Puede ser un horario (cada lunes a las 8 a. m.), un formulario o un correo nuevo.</li><li><b>Pasos:</b> qué hace. Por ejemplo, leer un archivo, filtrar filas, calcular un total o pedirle algo a una IA.</li><li><b>Salida:</b> dónde deja el resultado: un correo, una hoja de cálculo o un mensaje de Slack.</li></ul>
<p>Empieza por automatizar algo repetitivo y de bajo riesgo, como consolidar un reporte semanal. Agrega una revisión humana antes de enviar cualquier cosa a gerencia.</p>`,
'7-3': `<p>Un <b>agente SQL</b> convierte una pregunta en lenguaje natural, como "¿cuánto vendimos en Lima en marzo?", en una consulta SQL, la ejecuta y te devuelve el resultado.</p>
<p>Para conectar asistentes de IA con datos y herramientas existe <b>MCP (Model Context Protocol)</b>, un estándar abierto que funciona como un conector común entre la IA y otras aplicaciones, por ejemplo una base de datos o Power BI.</p>
<p>Buenas prácticas al conectar una IA a datos:</p>
<ul><li>Dale <b>solo permisos de lectura</b>. Nunca permisos para borrar o modificar tablas.</li><li>Limita el acceso a las tablas necesarias.</li><li>Revisa la consulta que generó antes de confiar en el resultado.</li></ul>
<p>Por eso saber SQL sigue siendo clave: si no lo entiendes, no podrás saber si el agente respondió bien.</p>`,
'7-4': `<p>La IA no está eliminando el trabajo del analista: lo está cambiando. Las tareas repetitivas, como descargar, consolidar, limpiar y actualizar reportes, se automatizan cada vez más.</p>
<p>Lo que gana valor:</p>
<ul><li><b>Entender el negocio</b> y traducir problemas en preguntas medibles.</li><li><b>Definir bien los indicadores</b>, para que la IA y los reportes usen las mismas reglas.</li><li><b>Validar resultados</b> y detectar cuándo algo no tiene sentido.</li><li><b>Comunicar</b> hallazgos y recomendar acciones.</li></ul>
<p>El analista de 2027 combina las bases (Excel, SQL, Python y Power BI) con el uso de IA y agentes, y dedica su tiempo a lo que requiere criterio.</p>`,
'8-1': `<p>Una <b>alucinación</b> ocurre cuando una IA genera información falsa o inventada y la presenta como cierta: una cifra, una fecha, una cita o una fuente que no existe. Pasa porque el modelo predice texto probable, no verifica hechos.</p>
<p>Señales de alerta que piden verificación extra:</p>
<ul><li>Cifras exactas, porcentajes o fechas.</li><li>Citas textuales o nombres de estudios y autores.</li><li>Enlaces o fuentes que no has abierto.</li></ul>
<p>Cómo validar:</p>
<ul><li>Recalcula las cifras clave en la fuente original.</li><li>Abre las fuentes que cita.</li><li>Pide a la IA que diga cuándo no está segura.</li></ul>
<p>Regla práctica: toda cifra que vaya a un reporte debe poder rastrearse hasta un dato verificado.</p>`,
'8-2': `<p>Un modelo de IA aprende de datos. Si esos datos reflejan desigualdades del pasado o representan mal a un grupo, el modelo <b>repite el sesgo</b> y puede tomar decisiones injustas.</p>
<p>Tipos de sesgo frecuentes:</p>
<ul><li><b>Sesgo de muestra:</b> los datos no representan a toda la población. Por ejemplo, encuestar solo a clientes satisfechos.</li><li><b>Sesgo histórico:</b> el modelo aprende decisiones pasadas que ya eran injustas, como contratar casi solo a hombres para un puesto.</li><li><b>Sesgo de medición:</b> los datos se recogen de forma distinta según el grupo.</li></ul>
<p>Como analista, pregúntate siempre: ¿a quién representa esta muestra y a quién deja fuera? Compara los resultados entre grupos y documenta las limitaciones de tus datos.</p>`,
'8-3': `<p>Cuando usas una herramienta de IA, lo que escribes o subes puede guardarse y, según el servicio y tu configuración, revisarse o usarse para mejorar el modelo. Por eso la privacidad es responsabilidad de quien la usa.</p>
<p>Antes de pegar datos en una IA, pregúntate: ¿incluye nombres, documentos de identidad, correos, teléfonos o datos financieros de personas? Si la respuesta es sí:</p>
<ul><li><b>Anonimiza:</b> reemplaza nombres por códigos y elimina documentos y correos.</li><li><b>Usa datos de ejemplo</b> con la misma estructura, pero inventados.</li><li><b>Revisa la política de tu empresa</b> sobre qué herramientas están autorizadas.</li></ul>
<p>En Perú, la Ley 29733 de Protección de Datos Personales regula el tratamiento de datos de las personas, y otros países tienen normas similares.</p>`,
'9-1': `<p>Un análisis solo genera valor si alguien lo entiende y actúa. El <b>storytelling con datos</b> combina tres elementos: datos, narrativa y visualización.</p>
<p>Una estructura simple para presentar resultados:</p>
<ul><li><b>Conclusión primero:</b> "Las ventas cayeron 12% por la región Sur."</li><li><b>Evidencia:</b> 2 o 3 cifras o gráficos que la respaldan.</li><li><b>Recomendación:</b> qué se debería hacer y qué impacto tendría.</li></ul>
<p>Consejos:</p>
<ul><li>Habla en lenguaje de negocio, no técnico. Di "los clientes que reciben el correo compran el doble", no "usé un LEFT JOIN".</li><li>Un gráfico, un mensaje.</li><li>Practica en voz alta y mide el tiempo.</li></ul>`,
'9-2': `<p>Pensar como el negocio significa empezar cada análisis preguntando: <b>¿qué decisión se va a tomar con esto?</b> La respuesta define qué datos necesitas, qué tan preciso debe ser el análisis y cómo presentarlo.</p>
<p>Cuando te piden algo vago, como "un reporte de todo", conversa antes de empezar:</p>
<ul><li>¿Qué problema quieren resolver?</li><li>¿Quién usará el resultado y para qué?</li><li>¿Para cuándo lo necesitan y qué nivel de detalle?</li></ul>
<p>Otras habilidades que marcan la diferencia: entender cómo gana dinero la empresa, conocer sus indicadores principales y hablar con las áreas (ventas, marketing, finanzas) para entender su día a día. Un analista que entiende el negocio propone análisis antes de que se los pidan.</p>`,
'9-3': `<p>Para un primer puesto de analista, un <b>portafolio</b> con proyectos propios suele pesar más que una lista de certificados: demuestra que sabes aplicar lo que aprendiste.</p>
<p>Un buen proyecto de portafolio incluye:</p>
<ul><li><b>El problema de negocio</b> y las preguntas que respondiste.</li><li><b>Los datos:</b> de dónde salen y cómo los limpiaste.</li><li><b>El proceso:</b> qué herramientas usaste (SQL, Python, Power BI) y por qué.</li><li><b>Los hallazgos y la recomendación.</b></li></ul>
<p>Publícalo en <b>GitHub</b> con un README claro y compártelo en <b>LinkedIn</b> contando qué descubriste. Dos o tres proyectos bien explicados, de la industria donde quieres trabajar, valen más que diez proyectos copiados de tutoriales.</p>`,
'10-1': `<p>Un proyecto de análisis de punta a punta sigue estos pasos:</p>
<ul><li><b>1. Definir el problema</b> y 3 preguntas de negocio concretas.</li><li><b>2. Conseguir datos</b> públicos y gratuitos, como datos abiertos del gobierno, el Banco Mundial o Gapminder.</li><li><b>3. Limpiar y explorar</b> con SQL o Python: nulos, duplicados, tipos de datos y valores extremos.</li><li><b>4. Analizar</b> para responder cada pregunta con evidencia.</li><li><b>5. Visualizar</b> en un dashboard claro.</li><li><b>6. Comunicar</b> los hallazgos y una recomendación.</li></ul>
<p>No necesita ser enorme: lo importante es una pregunta clara, un proceso ordenado y una conclusión bien sustentada. Elige un tema que te interese o de la industria donde quieres trabajar; se nota en el resultado.</p>`,
'10-2': `<p><b>Git</b> es un sistema que guarda el historial de cambios de tus archivos. <b>GitHub</b> es la plataforma donde publicas esos proyectos en línea. Para un analista, es la vitrina de su portafolio.</p>
<p>Conceptos básicos:</p>
<ul><li><b>Repositorio:</b> la carpeta de tu proyecto con su historial.</li><li><b>Commit:</b> una versión guardada de tus cambios, con un mensaje que explica qué cambiaste.</li><li><b>README:</b> el archivo que presenta tu proyecto. Es lo primero que verá un reclutador.</li></ul>
<p>No necesitas usar la terminal para empezar: desde la web de GitHub puedes crear un repositorio y subir archivos arrastrándolos. Un buen README explica el problema, los datos, el proceso, los hallazgos e incluye una imagen de tu dashboard.</p>`
};

const TOTAL_DAYS = MODULES.reduce((s, m) => s + m.days, 0);
// Duraciones en meses (1 mes = 30 días), con un decimal
const meses = d => { const v = Math.round(d / 30 * 10) / 10; return (Number.isInteger(v) ? v : v.toFixed(1)) + (v === 1 ? ' mes' : ' meses'); };
const TOTAL_MESES = Math.round(TOTAL_DAYS / 30) + ' meses';
const minLectura = html => Math.max(1, Math.round(html.replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length / 200));
// Duraciones en horas: contenido real (videos + lecturas) + 1 h de práctica por tema
// + 1 h de IA en la práctica + 1 h de cuestionario + 3 h de tarea aplicada. Se redondea a horas.
const H_TEMA = 60, H_IA = 1, H_QUIZ = 1, H_TAREA = 3;
const minVideo = t => { if (!t.video) return 0; const m = String(t.video[2]).split('·').pop(); const h = /(\d+)\s*h/.exec(m), mi = /(\d+)\s*min/.exec(m); return (h ? +h[1] * 60 : 0) + (mi ? +mi[1] : 0); };
const minTema = (m, j) => { const t = m.topics[j]; const key = m.id + '-' + (j + 1); return H_TEMA + minVideo(t) + (t.read ? (parseInt(String(t.read[2]).replace(/\D/g, '')) || 0) : 0) + minLectura(LECTURAS[key] || ''); };
const horasModulo = m => Math.round((m.topics.reduce((s, t, j) => s + minTema(m, j), 0) + (H_IA + H_QUIZ + H_TAREA) * 60) / 60);
const horas = m => horasModulo(m) + ' h';
const horasTema = (m, j) => Math.max(1, Math.round(minTema(m, j) / 60)) + ' h';

const KEY = 'ruta-ia-data-analyst-2027';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const modState = id => (store[id] = store[id] || { done: {}, crit: {} });
const parts = m => [...m.topics.map((_, i) => 'tema-' + (i + 1)), 'ia', 'cuestionario', 'tarea'];
const modProgress = m => { const s = modState(m.id); const p = parts(m); return { n: p.filter(x => s.done[x]).length, total: p.length }; };

const app = document.getElementById('app');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function resCard(kind, title, url, metaText) {
  const icon = kind === 'video' ? ICON_PLAY : kind === 'data' ? ICON_DATA : ICON_READ;
  return `<a class="res" href="${url}" target="_blank" rel="noopener"><span class="res-icon ${kind === 'video' ? 'video' : ''}" aria-hidden="true">${icon}</span><span class="res-body"><span class="res-type">${metaText}</span><span class="res-title">${title}</span></span><span class="res-go" aria-hidden="true">↗</span></a>`;
}
function readingBlock(key, t) {
  const html = LECTURAS[key] || '';
  return `<article class="reading" aria-labelledby="lec-${key}">
    <div class="reading-head"><span class="res-icon" aria-hidden="true">${ICON_READ}</span><div><span class="res-type">Lectura · ${minLectura(html)} min</span><b id="lec-${key}">Lee aquí: resumen rápido</b></div></div>
    <p class="reading-note">Esto es un pequeño resumen para ubicarte en el tema. No reemplaza a la lectura completa.</p>
    <div class="reading-body">${html}</div>
    <div class="reading-cta">
      <p><b>Para entender el tema mucho mejor, lee el artículo completo.</b> Ahí están los ejemplos y explicaciones que este resumen no alcanza a cubrir, y de él también salen preguntas del cuestionario y del examen.</p>
      <a class="reading-btn" href="${t.read[1]}" target="_blank" rel="noopener" data-lectura="${key}">Leer la lectura completa <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
      <span class="reading-src"><b>${t.read[0]}</b>${t.read[3] ? ` · ${t.read[3]}` : ''}${t.read[2] ? ` · ${t.read[2].replace('~', '')} de lectura` : ''}</span>
    </div>
  </article>`;
}
function videoBlock(t, key) {
  const id = ytId(t.video[1]);
  const c = t.clip || null;
  const hms = n => { const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s = n % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
  const href = c ? `${t.video[1]}&t=${c[0]}s` : t.video[1];
  return `<div class="video">
    <div class="video-frame">
      <button class="video-facade" type="button" data-yt="${id}"${c ? ` data-start="${c[0]}" data-end="${c[1]}"` : ''} data-title="${t.video[0].replace(/"/g, '&quot;')}" aria-label="Reproducir el video: ${t.video[0].replace(/"/g, '&quot;')}">
        <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">
        <span class="video-title">${t.video[0]}</span>${c ? `<span class="video-clip">Fragmento ${hms(c[0])}–${hms(c[1])}</span>` : ''}
        <span class="play" aria-hidden="true">${ICON_PLAY}</span>
      </button>
    </div>
    <div class="video-meta"><span class="res-type">Video · ${t.video[2]}</span><a href="${href}" target="_blank" rel="noopener">Ver en YouTube ↗</a>${t.playlist ? `<a href="${t.playlist}" target="_blank" rel="noopener">Ver la lista completa ↗</a>` : ''}</div>
  </div>`;
}
const canEmbed = () => /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);

const STAGE_ICON = { fund: MOD_ICON[1], tools: MOD_ICON[3], ia: MOD_ICON[6], emp: MOD_ICON[10] };

function moduleCard(m) {
  const st = stageOf(m.id), p = modProgress(m);
  const state = p.n === p.total ? 'Completado' : p.n ? Math.round(p.n / p.total * 100) + '% completado' : 'Sin empezar';
  return `<a class="card" href="#modulo-${m.id}" style="--stage: var(--st-${st.key})">

}

function renderCards() {
  const box = document.getElementById('cards');
  if (!box) return;
  const q = norm(query.trim());
  const list = MODULES.filter(m => (stageFilter === 'all' || stageOf(m.id).key === stageFilter) &&

  const showEnds = stageFilter === 'all' && !q;

function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function shuffled(item, seed) {
  const rnd = seeded(seed);
  const idx = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return { opts: idx.map(i => item[1][i]), ans: idx.indexOf(item[2]) };
}

        b.type = 'button'; b.className = 'opt'; b.id = `m${m.id}q${qi}o${oi}`;

            else if (!ok && i === ans) x.classList.add('is-answer');
            else x.classList.add('is-dim');
          });
          const fb = document.createElement('p');
          fb.className = 'feedback ' + (ok ? 'ok' : 'bad'); fb.setAttribute('role', 'status');
          fb.innerHTML = `<strong>${ok ? '¡Correcto! ' : 'Incorrecto. La respuesta es la ' + L[ans] + '. '}</strong>${item[3]}`;
          card.appendChild(fb);
          answered++; if (ok) correct++; Dati.react(ok ? 'ok' : 'bad'); updateQuiz();
        });
        box.appendChild(b);
      });
      quiz.appendChild(card);
    });
    updateQuiz();
  };
  const updateQuiz = () => {
    document.getElementById('q-label').textContent = answered + ' de 10';
    document.getElementById('q-ok').textContent = '✓ ' + correct;
    document.getElementById('q-fill').style.width = answered * 10 + '%';
    const done = answered === m.quiz.length;
    document.getElementById('final').hidden = !done;
    if (done) {
      document.getElementById('final-score').innerHTML = correct + '<span> / 10</span>';

    }
  };
  document.getElementById('retry').addEventListener('click', () => { renderQuiz(); document.getElementById('cuestionario').scrollIntoView(); });
  renderQuiz();
  refresh();
}
