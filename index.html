<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ruta gratuita de 10 módulos para convertirte en IA Data Analyst: lecturas, videos verificados, cuestionarios y tareas aplicadas.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ruta IA Data Analyst 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: vista "Ruta" con tarjetas de los 10 módulos; vista de módulo con índice fijo a la izquierda
   (barra horizontal en móvil) + columna de lectura. El orden es un recorrido real de días, por eso se numera. */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --fg: #15222a; --muted: #5a6a73; --line: #d8e1e5;
  --accent: #1d5f86; --accent-soft: #e2edf4; --ok: #1d7a46; --ok-soft: #e1f2e7;
  --bad: #c0362c; --bad-soft: #fbe5e3; --idea: #f1ecdf; --idea-line: #c9a24a; --on-accent: #ffffff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1518; --surface: #162026; --fg: #e5edf0; --muted: #98a9b1; --line: #29383f;
    --accent: #7cbbe0; --accent-soft: #1a3140; --ok: #5fd08d; --ok-soft: #163325;
    --bad: #ff8a7f; --bad-soft: #3a1d1b; --idea: #2a2618; --idea-line: #c9a24a; --on-accent: #0e1518;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1518; --surface: #162026; --fg: #e5edf0; --muted: #98a9b1; --line: #29383f;
  --accent: #7cbbe0; --accent-soft: #1a3140; --ok: #5fd08d; --ok-soft: #163325;
  --bad: #ff8a7f; --bad-soft: #3a1d1b; --idea: #2a2618; --idea-line: #c9a24a; --on-accent: #0e1518;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero .wrap { padding-block: 32px 26px; display: flex; flex-direction: column; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; }
.crumbs a { text-decoration: none; font-weight: 500; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.05; font-weight: 800; max-width: 20ch; }
.hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); }
.progress { display: flex; align-items: center; gap: 12px; max-width: 520px; }
.track { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 0; }
.fill { height: 100%; width: 0; background: var(--ok); transition: width .35s ease; }
.progress span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Vista Ruta */
.overview { padding-block: 32px 72px; display: flex; flex-direction: column; gap: 24px; }
.mods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.mod { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: start; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; transition: border-color .15s; }
.mod:hover { border-color: var(--accent); }
.mod-num { grid-row: span 3; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.6ch; }
.mod.done .mod-num { color: var(--ok); }
.mod h2 { font-size: 19px; line-height: 1.25; }
.mod p { margin: 0; font-size: 14px; color: var(--muted); }
.mod .track { height: 5px; margin-top: 6px; }
.note { font-size: 14px; color: var(--muted); max-width: 70ch; margin: 0; }

/* Vista Módulo */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-block: 32px 72px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.toc-title { font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.toc button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--fg); background: none; border: 0; text-align: left; font-size: 14px; cursor: pointer; }
.toc button:hover { background: var(--accent-soft); }
.dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.dot svg { width: 11px; height: 11px; opacity: 0; }
.toc button.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.toc button.done .dot svg { opacity: 1; }
.content { display: flex; flex-direction: column; gap: 28px; max-width: 700px; min-width: 0; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 80px; }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.block-head h2 { font-size: 22px; line-height: 1.2; }
.kicker { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.days { font-size: 13px; color: var(--muted); white-space: nowrap; }
.block p { margin: 0; }
.goals { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.step b { font-family: var(--font-display); font-size: 16px; }
.step span { font-size: 14px; color: var(--muted); }
.res { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--fg); background: var(--bg); transition: border-color .15s, background .15s; }
.res:hover { border-color: var(--accent); background: var(--accent-soft); }
.res-icon { flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.res-icon.video { background: var(--bad-soft); color: var(--bad); }
.res-icon svg { width: 20px; height: 20px; }
.res-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.res-type { font-size: 12px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em; }
.res-title { font-weight: 500; }
.res-go { flex: none; color: var(--muted); }
.novideo { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.idea { background: var(--idea); border-left: 3px solid var(--idea-line); border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 15px; }
.check { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font-size: 14px; font-weight: 500; color: var(--fg); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px 8px 10px; cursor: pointer; }
.check:hover { border-color: var(--ok); }
.check .box { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.check .box svg { width: 12px; height: 12px; opacity: 0; }
.check[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }
.check[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.check[aria-pressed="true"] .box svg { opacity: 1; }
.prompts { display: flex; flex-direction: column; gap: 10px; }
.prompt { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.prompt p { flex: 1; min-width: 0; font-size: 15px; font-style: italic; }
.copy { flex: none; font-size: 13px; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.warn { font-size: 15px; color: var(--muted); }
.qbar { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qbar .track { height: 6px; }
.qbar .fill { background: var(--accent); }
.q { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.q-head { display: flex; gap: 12px; align-items: baseline; }
.q-num { font-family: var(--font-mono); font-size: 13px; color: var(--accent); flex: none; }
.q-text { font-weight: 500; min-width: 0; }
.data { font-family: var(--font-mono); font-size: 14px; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--fg); text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.letter { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; border: 1.5px solid var(--line); color: var(--muted); }
.opt-text { flex: 1; min-width: 0; }
.mark { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.mark svg { width: 16px; height: 16px; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ok .mark { background: var(--ok); color: var(--surface); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-bad .mark { background: var(--bad); color: var(--surface); }
.opt.is-answer { border-color: var(--ok); border-style: dashed; }
.opt.is-dim { opacity: .55; }
.feedback { font-size: 15px; padding: 12px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--bad); }
.final { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.score { font-family: var(--font-display); font-size: 44px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.score span { font-size: 20px; color: var(--muted); font-weight: 600; }
.btn { font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-block; }
.context { background: var(--bg); border-radius: 10px; padding: 14px 16px; font-size: 15px; }
.tasks { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.tasks li::marker { font-family: var(--font-mono); color: var(--accent); }
code { font-family: var(--font-mono); font-size: 13.5px; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.sqlbox { position: relative; }
.sqlbox pre { margin: 0; max-height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.sqlbox .copy { position: absolute; top: 8px; right: 8px; }
.criteria { display: flex; flex-direction: column; gap: 8px; }
.criteria label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.criteria input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--ok); flex: none; }
h3 { font-size: 17px; }
.next { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 20px 24px; text-decoration: none; }
.next b { font-family: var(--font-display); font-size: 18px; }
.next span { font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 0; }
  nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; flex-direction: row; overflow-x: auto; gap: 4px; padding-block: 10px; background: var(--bg); border-bottom: 1px solid var(--line); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .toc-title { display: none; }
  .toc button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; }
  .content { max-width: none; }
  .mods { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } .block { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

</head>
<body>
<div id="app"></div>

<script>
// Contenido de la Ruta IA Data Analyst 2027. Videos verificados: publicados desde 2025, 10k+ vistas, comentarios que respaldan su utilidad.
const YT = id => 'https://www.youtube.com/watch?v=' + id;
const MODULES = [
{
  id: 1, title: 'Pensamiento analítico y estadística', days: 10,
  lead: 'Aprende a pensar como analista de datos: hacer las preguntas correctas, medir con KPIs y resumir datos con estadística.',
  goals: ['Explicar qué hace un analista de datos y los 4 tipos de análisis.', 'Convertir un problema de negocio en preguntas que se respondan con datos.', 'Definir KPIs claros con el método SMART.', 'Calcular e interpretar media, mediana, moda, rango y desviación estándar.', 'Entender qué es una distribución de probabilidad y por qué la normal es tan usada.'],
  topics: [
    { t: 'El analista de datos y los 4 tipos de análisis', d: 'Días 1-2', read: ['Los cuatro tipos de análisis de datos: una guía completa', 'https://datademia.es/blog/los-cuatro-tipos-de-analisis-de-datos-una-guia-completa', '6 min'], video: ['Qué es ser analista de datos y cómo funciona en verdad (realidad, salario, herramientas e IA)', YT('YhJ8L2hGZ48'), 'may 2026 · 31 mil vistas · 13 min'], idea: 'Cada tipo de análisis responde una pregunta distinta: ¿qué pasó? (descriptivo), ¿por qué pasó? (diagnóstico), ¿qué podría pasar? (predictivo) y ¿qué deberíamos hacer? (prescriptivo).' },
    { t: 'Pensamiento analítico, preguntas de negocio y KPIs', d: 'Días 3-4', read: ['Cómo crear KPIs que lleven tu empresa al éxito', 'https://www.tableau.com/es-mx/learn/articles/how-to-create-kpis', '5 min'], video: ['Top KPIs que todo analista debería entender', YT('B4ZxyyL0-08'), 'mar 2026 · 85 mil vistas · 21 min'], idea: 'Un buen análisis empieza con una buena pregunta. "¿Cómo van las ventas?" es vaga; "¿Qué categoría redujo más sus ventas este trimestre frente al anterior?" se puede responder con datos.' },
    { t: 'Estadística descriptiva', d: 'Días 5-7', read: ['Estadística descriptiva: qué es, objetivo, tipos y ejemplos', 'https://questionpro.com/blog/es/estadistica-descriptiva', '14 min'], video: ['¿Qué es la estadística? Introducción al análisis de datos', YT('jMC1p_CV170'), 'jun 2025 · 72 mil vistas · 20 min'], idea: 'El promedio puede engañar. Si hay un valor muy extremo, la mediana describe mejor el caso típico.' },
    { t: 'Probabilidad y distribuciones', d: 'Día 8', read: ['4 distribuciones de probabilidad básicas a usar como Data Scientist', 'https://datasciencepe.substack.com/p/4-distribuciones-de-probabilidad', '4 min'], video: ['¿Qué es una distribución de probabilidad? Fundamentos de ciencia de datos', YT('cD7ErDI-424'), 'jun 2025 · 11 mil vistas · 17 min'], idea: 'Muchos datos reales, como estaturas o tiempos de entrega, se agrupan alrededor de un valor central con forma de campana: la distribución normal.' }
  ],
  ia: { prompts: ['Soy analista de una tienda online. Las ventas bajaron 15% este mes. Dame 5 preguntas de negocio para investigar la causa y dime qué tipo de análisis es cada una.', 'Explícame con un ejemplo de ventas por qué la mediana a veces es mejor que el promedio.', 'Revisa si este KPI cumple el método SMART y mejóralo: [escribe tu KPI]'] },
  quizDay: 'Día 9',
  quiz: [
    ['Un gerente pregunta: "¿Por qué bajaron las ventas en marzo?". ¿Qué tipo de análisis necesita?', ['Descriptivo', 'Diagnóstico', 'Predictivo', 'Prescriptivo'], 1, 'El análisis diagnóstico busca las causas de lo que pasó: responde "¿por qué?".'],
    ['"¿Cuánto venderemos el próximo trimestre?" corresponde al análisis:', ['Descriptivo', 'Diagnóstico', 'Predictivo', 'Prescriptivo'], 2, 'Estimar lo que podría pasar en el futuro es análisis predictivo.'],
    ['¿Cuál de estas preguntas de negocio está mejor formulada para un análisis de datos?', ['¿Cómo está la empresa?', '¿Los clientes están contentos?', '¿Qué región tuvo la mayor caída en ventas en el último trimestre frente al anterior?', '¿Deberíamos vender más?'], 2, 'Es específica: dice qué medir (ventas), cómo compararlo (por región) y en qué periodo.'],
    ['En el método SMART para definir KPIs, la "T" (Time-bound) significa que el KPI:', ['Debe ser técnico', 'Debe tener un plazo definido', 'Debe medirse en tiempo real', 'Debe ser total'], 1, 'Time-bound significa "con plazo": el KPI dice para cuándo debe lograrse la meta.'],
    ['¿Cuál de estos es un KPI bien definido?', ['Mejorar las ventas', 'Tener más clientes felices', 'Aumentar la tasa de recompra de 20% a 25% antes de diciembre', 'Vender lo máximo posible'], 2, 'Tiene una métrica, un valor de partida, una meta numérica y un plazo.'],
    ['Los salarios de 5 personas son <span class="data">1,500 · 1,600 · 1,700 · 1,800 · 15,000</span>. ¿Qué medida representa mejor el salario típico?', ['La media', 'La mediana', 'El rango', 'La varianza'], 1, 'El valor 15,000 sube la media a 4,320. La mediana (1,700) no se deja arrastrar por ese valor extremo.'],
    ['La moda de los datos <span class="data">3, 5, 5, 7, 8, 5, 9</span> es:', ['5', '6', '7', '9'], 0, 'La moda es el valor que más se repite: el 5 aparece tres veces.'],
    ['Una desviación estándar alta indica que los datos:', ['Están muy cerca del promedio', 'Están muy dispersos respecto al promedio', 'Tienen errores', 'Siguen una distribución normal'], 1, 'La desviación estándar mide cuánto se alejan los datos del promedio. Más alta, más dispersión.'],
    ['En una distribución normal, ¿qué porcentaje aproximado de los datos está a menos de 1 desviación estándar del promedio?', ['50%', '68%', '95%', '99.7%'], 1, 'Regla 68-95-99.7: cerca del 68% está a 1 desviación, 95% a 2 y 99.7% a 3.'],
    ['Una IA te dice que el promedio de <span class="data">10, 20 y 60</span> es 20. ¿Qué haces?', ['Lo aceptas, la IA no se equivoca', 'Lo verificas: el promedio es 30 (y 20 es la mediana)', 'Lo cambias por la moda', 'Le pides que lo redondee'], 1, '(10 + 20 + 60) / 3 = 30. La IA confundió el promedio con la mediana. Verifica siempre sus cálculos.']
  ],
  task: { day: 'Día 10',
    context: 'Trabajas como analista en una tienda online que quiere expandirse a otro país de Latinoamérica. Tu jefe te pide una primera mirada con datos sobre el uso de internet en la región.',

function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function shuffled(item, seed) {
  const rnd = seeded(seed);
  const idx = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return { opts: idx.map(i => item[1][i]), ans: idx.indexOf(item[2]) };
}

    <div class="progress"><div class="track" aria-hidden="true"><div class="fill" id="mod-fill"></div></div><span id="mod-label"></span></div>
  </div></header>
  <div class="wrap layout">
    <nav class="toc" aria-label="Contenido del módulo">
      <span class="toc-title">Contenido</span>
      <button type="button" data-go="inicio-mod" data-part="inicio"><span class="dot">${TICK}</span>Inicio</button>
      ${m.topics.map((_, i) => `<button type="button" data-go="tema-${i + 1}" data-part="tema-${i + 1}"><span class="dot">${TICK}</span>Tema ${i + 1}</button>`).join('')}
      <button type="button" data-go="ia" data-part="ia"><span class="dot">${TICK}</span>IA en la práctica</button>
      <button type="button" data-go="cuestionario" data-part="cuestionario"><span class="dot">${TICK}</span>Cuestionario</button>
      <button type="button" data-go="tarea" data-part="tarea"><span class="dot">${TICK}</span>Tarea aplicada</button>
    </nav>
    <main class="content">
      <section class="block" id="inicio-mod">
        <div class="block-head"><h2>Al terminar este módulo podrás</h2></div>
        <ul class="goals">${m.goals.map(g => `<li>${g}</li>`).join('')}</ul>
        <h3>Cómo estudiar cada tema</h3>
        <div class="steps">
          <div class="step"><b>1. Lee</b><span>Un artículo corto para entender la idea.</span></div>
          <div class="step"><b>2. Mira</b><span>El video de YouTube y toma notas.</span></div>
          <div class="step"><b>3. Marca</b><span>El tema como completado para ver tu avance.</span></div>
        </div>
      </section>
      ${topics}
      <section class="block" id="ia">
        <div class="block-head"><div><span class="kicker">Práctica</span><h2>IA en la práctica</h2></div><span class="days">Durante el módulo</span></div>
        <p>Usa Claude o ChatGPT como compañero de estudio. Copia estos prompts y adáptalos:</p>
        <div class="prompts">${m.ia.prompts.map(p => `<div class="prompt"><p>${p}</p><button class="copy" type="button">Copiar</button></div>`).join('')}</div>
        <p class="warn">Compara las respuestas con lo que aprendiste: la IA puede equivocarse con total seguridad. No compartas datos confidenciales.${m.ia.note ? ' ' + m.ia.note : ''}</p>
        ${checkBtn('ia', 'Marcar práctica como completada')}
      </section>
      <section class="block" id="cuestionario">
        <div class="block-head"><div><span class="kicker">Evaluación</span><h2>Cuestionario</h2></div><span class="days">${m.quizDay}</span></div>
        <p>10 preguntas. Elige una alternativa y verás al instante si acertaste. Apruebas con 7 o más.</p>
        <div class="qbar"><span id="q-label">0 de 10</span><div class="track" aria-hidden="true"><div class="fill" id="q-fill"></div></div><span id="q-ok">✓ 0</span></div>
        <div id="quiz" style="display:flex;flex-direction:column;gap:18px"></div>
        <div class="final" id="final" hidden aria-live="polite"><p class="score" id="final-score"></p><p id="final-msg"></p><button class="btn" id="retry" type="button">Volver a intentar</button></div>
      </section>
      <section class="block" id="tarea">
        <div class="block-head"><div><span class="kicker">Proyecto</span><h2>Tarea aplicada</h2></div><span class="days">${tk.day}</span></div>
        <p class="context"><b>Contexto:</b> ${tk.context}</p>
        ${dataBlock}
        <h3>Qué debes hacer</h3>
        <ol class="tasks">${tk.steps.map(x => `<li>${x}</li>`).join('')}</ol>
        <h3>Tu tarea está completa si…</h3>
        <div class="criteria">${tk.criteria.map((c, i) => `<label><input type="checkbox" id="m${m.id}-crit-${i}" data-crit="${i}">${c}</label>`).join('')}</div>
        <p class="warn">Compártela: publica una captura y tu conclusión en LinkedIn contando qué aprendiste.</p>
      </section>
      ${next ? `<a class="next" href="#modulo-${next.id}"><span><b>Siguiente: Módulo ${next.id} · ${next.title}</b><br><span>${next.days} días · ${next.topics.length} temas</span></span><span aria-hidden="true">→</span></a>` : `<a class="next" href="#inicio"><span><b>¡Terminaste la ruta!</b><br><span>Vuelve a la vista general para revisar tu avance.</span></span><span aria-hidden="true">→</span></a>`}
      <p class="foot">Creado y recopilado por <a href="https://www.linkedin.com/in/afredoamez/" target="_blank" rel="noopener">Alfredo Diego Amez Mendes</a>.</p>
    </main>
  </div>`;
  document.title = 'Módulo ' + m.id + ' · ' + m.title;

  const refresh = () => {
    const p = parts(m), n = p.filter(x => s.done[x]).length;
    document.getElementById('mod-fill').style.width = (n / p.length * 100) + '%';
    document.getElementById('mod-label').textContent = n + ' de ' + p.length + ' partes completadas';
    app.querySelectorAll('.toc button').forEach(b => b.classList.toggle('done', b.dataset.part === 'inicio' || !!s.done[b.dataset.part]));
    app.querySelectorAll('[data-check]').forEach(b => {
      const on = !!s.done[b.dataset.check]; b.setAttribute('aria-pressed', on);
      b.querySelector('.lbl').textContent = on ? (b.dataset.check === 'ia' ? 'Práctica completada' : 'Tema completado') : (b.dataset.check === 'ia' ? 'Marcar práctica como completada' : 'Marcar tema como completado');
    });
  };
  app.querySelectorAll('[data-check]').forEach(b => b.addEventListener('click', () => { s.done[b.dataset.check] = !s.done[b.dataset.check]; save(); refresh(); }));
  app.querySelectorAll('.toc button').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.go).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })));

  const crits = app.querySelectorAll('[data-crit]');
  crits.forEach(c => { c.checked = !!s.crit[c.dataset.crit]; c.addEventListener('change', () => { s.crit[c.dataset.crit] = c.checked; s.done.tarea = [...crits].every(x => x.checked); save(); refresh(); }); });

  app.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', () => {
    const el = btn.dataset.copy ? document.getElementById(btn.dataset.copy) : btn.previousElementSibling;
    const ok = () => { btn.textContent = 'Copiado'; setTimeout(() => btn.textContent = 'Copiar', 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const g = getSelection(); g.removeAllRanges(); g.addRange(r); };
    try { navigator.clipboard.writeText(el.textContent).then(ok).catch(sel); } catch (e) { sel(); }
  }));

  // Cuestionario
  const quiz = document.getElementById('quiz');
  let answered = 0, correct = 0;
  const renderQuiz = () => {
    answered = 0; correct = 0; quiz.innerHTML = '';
    m.quiz.forEach((item, qi) => {
      const { opts, ans } = shuffled(item, m.id * 31 + qi * 7 + 3);
      const card = document.createElement('div');
      card.className = 'q';
      card.innerHTML = `<div class="q-head"><span class="q-num">${String(qi + 1).padStart(2, '0')}</span><p class="q-text" id="m${m.id}q${qi}">${item[0]}</p></div><div class="opts" role="group" aria-labelledby="m${m.id}q${qi}"></div>`;
      const box = card.querySelector('.opts');
      opts.forEach((text, oi) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.id = `m${m.id}q${qi}o${oi}`;
        b.innerHTML = `<span class="letter">${L[oi]}</span><span class="opt-text">${text}</span><span class="mark" aria-hidden="true"></span>`;
        b.addEventListener('click', () => {
          const ok = oi === ans;
          card.querySelectorAll('.opt').forEach((x, i) => {
            x.disabled = true;
            if (i === oi) { x.classList.add(ok ? 'is-ok' : 'is-bad'); x.querySelector('.mark').innerHTML = ok ? TICK : CROSS; x.setAttribute('aria-label', (ok ? 'Correcta: ' : 'Incorrecta: ') + x.textContent); }
            else if (!ok && i === ans) x.classList.add('is-answer');
            else x.classList.add('is-dim');
          });
          const fb = document.createElement('p');
          fb.className = 'feedback ' + (ok ? 'ok' : 'bad'); fb.setAttribute('role', 'status');
          fb.innerHTML = `<strong>${ok ? '¡Correcto! ' : 'Incorrecto. La respuesta es la ' + L[ans] + '. '}</strong>${item[3]}`;
          card.appendChild(fb);
          answered++; if (ok) correct++; updateQuiz();
        });
        box.appendChild(b);
      });
      quiz.appendChild(card);
    });
    updateQuiz();
  };
  const updateQuiz = () => {
    document.getElementById('q-label').textContent = answered + ' de 10';
    document.getElementById('q-ok').textContent = '✓ ' + correct;
    document.getElementById('q-fill').style.width = answered * 10 + '%';
    const done = answered === m.quiz.length;
    document.getElementById('final').hidden = !done;
    if (done) {
      document.getElementById('final-score').innerHTML = correct + '<span> / 10</span>';
      document.getElementById('final-msg').textContent = correct >= 9 ? 'Excelente. Dominas los conceptos del módulo: pasa a la tarea aplicada.' : correct >= 7 ? 'Bien. Repasa las preguntas que fallaste antes de hacer la tarea aplicada.' : 'Vuelve a revisar los temas que fallaste y luego intenta de nuevo.';
      if (correct >= 7 && !s.done.cuestionario) { s.done.cuestionario = true; save(); refresh(); }
    }
  };
  document.getElementById('retry').addEventListener('click', () => { renderQuiz(); document.getElementById('cuestionario').scrollIntoView(); });
  renderQuiz();
  refresh();
}

function route() {
  const h = location.hash.replace('#', '');
  const m = MODULES.find(x => 'modulo-' + x.id === h);
  if (m) renderModule(m); else renderOverview();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>

</body>
</html>
