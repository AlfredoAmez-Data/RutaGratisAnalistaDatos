    <p>Llegaste al final de la ruta. Aquí tienes cómo seguir creciendo, cómo compartir tu logro y cómo apoyar para que esta ruta siga siendo gratuita.</p>
    <div class="meta"><span class="chip">Cierre de la ruta</span><span class="chip">Gratis y sin registro</span></div>
  </div>${qrMini()}</div></header>
  <main class="wrap overview" style="max-width:820px">
    <section class="block">
      <div class="block-head"><div><span class="kicker">Gracias</span><h2>¡Gracias por llegar hasta aquí!</h2></div></div>
      <p>Completar ${TOTAL_HORAS} de estudio requiere constancia, y la tuviste. Hoy sabes analizar datos con Excel, SQL y Python, construir dashboards en Power BI y trabajar con inteligencia artificial con criterio. Gracias por confiar en esta ruta y por darle tu tiempo.</p>
    </section>
    <section class="block">
      <div class="block-head"><div><span class="kicker">Lo que viene</span><h2>Tus siguientes pasos</h2></div></div>
      <ol class="tasks">
        <li><b>Haz 2 proyectos más</b> para tu portafolio, con temas de la industria donde quieres trabajar.</li>
        <li><b>Actualiza tu LinkedIn y tu CV</b> con las herramientas que dominas y enlaza tu repositorio de GitHub.</li>
        <li><b>Postula</b> a prácticas y puestos junior de analista de datos. Prepárate explicando tu proyecto final de punta a punta.</li>
        <li><b>Considera una certificación</b> cuando estés listo, por ejemplo PL-300 (Power BI Data Analyst) de Microsoft.</li>
        <li><b>Sigue aprendiendo cada semana:</b> la IA cambia rápido y el analista que se actualiza es el que más crece.</li>
      </ol>
    </section>
    <section class="block">
      <div class="block-head"><div><span class="kicker">Comparte</span><h2>¿La ruta te ayudó? Publícalo en LinkedIn y etiquétame</h2></div></div>
      <p>Compartir tu logro te da visibilidad ante reclutadores y ayuda a que más personas encuentren esta ruta gratuita. Al escribir tu publicación, escribe <b>@Alfredo Amez</b> y elige mi perfil para etiquetarme: así podré felicitarte y compartir tu avance.</p>
      <div class="postbox">
        <pre class="post" id="post-li">${esc(LINKEDIN_POST)}</pre>
        <div class="cta"><button class="btn" type="button" id="copy-post">Copiar publicación</button><a class="btn ghost" href="${LINKEDIN}" target="_blank" rel="noopener">Ver mi perfil de LinkedIn</a></div>
      </div>
      <p class="warn">Agrega una captura de tu dashboard o de tu proyecto final: las publicaciones con imagen llegan a más personas.</p>
    </section>
    <section class="block">
      <div class="block-head"><div><span class="kicker">Constancia</span><h2>Obtén tu constancia de finalización</h2></div></div>
      <p>Rinde el examen final: 50 preguntas de toda la ruta, 120 minutos y 40 respuestas correctas para aprobar. Si apruebas, descargas tu constancia en PDF o imagen, con un código que cualquiera puede verificar.</p>
      <div class="cta"><a class="btn" href="#constancia">Ir al examen final</a></div>
    </section>
    ${supportBlock()}
    <section class="quote" aria-label="Mensaje final">
      <p>No importa desde dónde empezaste: importa que no te detuviste. Cada consulta, cada dashboard y cada error corregido te acercaron a tu meta. Sigue avanzando por tu objetivo; tu primer trabajo como AI Data Analyst está más cerca de lo que crees.</p>
      <span>— Alfredo Amez</span>
    </section>
  </main>
  ${footer()}`;

  btn.addEventListener('click', () => {
    track('post_linkedin_copiado');
    const el = document.getElementById('post-li');
    const ok = () => { btn.textContent = 'Publicación copiada'; setTimeout(() => btn.textContent = 'Copiar publicación', 1800); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const g = getSelection(); g.removeAllRanges(); g.addRange(r); };
    try { navigator.clipboard.writeText(el.textContent).then(ok).catch(sel); } catch (e) { sel(); }
  });

const fechaLarga = f => { const [y, m, d] = String(f).split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-PE', { day: 'numeric', month: 'long', year: 'numeric' }); };
const fechaHora = ms => new Date(ms).toLocaleString('es-PE', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

// Simulador local solo para la vista previa: en la web publicada no existe y todo se corrige en el servidor.
const demoServer = (() => {
  if (!CERT_DEMO) return null;
  const DBK = 'ruta-ia-demo-servidor';
  let db = { intentos: [], certs: [] };
  try { db = JSON.parse(localStorage.getItem(DBK)) || db; } catch (e) {}
  const guardar = () => { try { localStorage.setItem(DBK, JSON.stringify(db)); } catch (e) {} };
  const mezcla = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const armar = sel => sel.map(([i, p]) => ({ m: DEMO_BANCO[i][0], t: DEMO_BANCO[i][1], o: p.map(k => DEMO_BANCO[i][2 + k]) }));
  return {
    iniciar(b) {
      const correo = String(b.correo || '').trim().toLowerCase();
      if (String(b.nombre || '').trim().length < 5) return { ok: false, error: 'Escribe tu nombre completo (entre 5 y 80 caracteres).' };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return { ok: false, error: 'Escribe un correo válido.' };
      const c = db.certs.find(x => x.correo === correo);
      if (c) return { ok: true, yaAprobado: true, ...c, total: 50 };
      const c0 = this.ciclo(correo);
      if (c0.usados >= CERT.intentos) return { ok: false, espera: true, proximo: c0.proximo };
      const sel = [];
      for (let m = 1; m <= 10; m++) mezcla(DEMO_BANCO.map((p, i) => p[0] === m ? i : -1).filter(i => i >= 0)).slice(0, 5).forEach(i => sel.push([i, mezcla([0, 1, 2, 3])]));
      const it = { id: 'demo-' + Date.now(), correo, nombre: b.nombre.trim(), ini: Date.now(), fin: Date.now() + CERT.minutos * 60e3, sel: mezcla(sel), estado: 'en curso' };
      db.intentos.push(it); guardar();
      return { ok: true, id: it.id, fin: it.fin, ahora: Date.now(), intento: c0.usados + 1, de: CERT.intentos, preguntas: armar(it.sel) };
    },
    enviar(b) {
      const it = db.intentos.find(x => x.id === b.id);
      if (!it || it.estado !== 'en curso') return { ok: false, error: 'Este examen ya fue enviado.' };
      it.estado = 'enviado'; it.enviado = Date.now(); guardar();
      const puntaje = it.sel.filter((s, i) => s[1][b.respuestas[i]] === 0).length;
      const c = this.ciclo(it.correo), aprobado = puntaje >= CERT.aprueba;
      const out = { ok: true, puntaje, total: 50, aprobado, aTiempo: true, nombre: it.nombre, restantes: aprobado ? 0 : Math.max(0, CERT.intentos - c.usados), proximo: c.proximo };
      if (out.aprobado) {
        const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = () => Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join('');
        out.codigo = `RIA27-${r()}-${r()}`; out.fecha = new Date().toISOString().slice(0, 10);
        db.certs.push({ codigo: out.codigo, nombre: it.nombre, correo: it.correo, puntaje, fecha: out.fecha }); guardar();
      }
      return out;
    },
    ciclo(correo) {
      const ahora = Date.now(); let usados = 0, bloqueo = 0;
      db.intentos.filter(x => x.correo === correo && (x.estado !== 'en curso' || x.fin <= ahora)).sort((a, b) => a.ini - b.ini).forEach(x => {
        if (usados >= CERT.intentos && x.ini >= bloqueo) usados = 0;
        usados++;
        if (usados === CERT.intentos) bloqueo = (x.enviado || x.fin) + CERT.esperaHoras * 3600e3;
      });
      if (usados >= CERT.intentos && ahora >= bloqueo) usados = 0;
      return { usados, proximo: usados >= CERT.intentos ? bloqueo : 0 };
    },
    verificar(codigo) { const c = db.certs.find(x => x.codigo === String(codigo).trim().toUpperCase()); return c ? { ok: true, valido: true, codigo: c.codigo, nombre: c.nombre, puntaje: c.puntaje, total: 50, fecha: c.fecha } : { ok: true, valido: false }; },
    // Solo para probar la vista previa: respuestas correctas del intento actual
    trampa(id) { const it = db.intentos.find(x => x.id === id); return it ? it.sel.map(s => s[1].indexOf(0)) : []; }
  };
})();

async function certReq(accion, datos = {}) {
  if (demoServer) { await new Promise(r => setTimeout(r, 450)); return accion === 'verificar' ? demoServer.verificar(datos.codigo) : demoServer[accion](datos); }
  if (!/^https:\/\/script\.google\.com\//.test(CERT_API)) return { ok: false, error: 'El examen todavía no está disponible. Vuelve pronto.' };
  try {
    const r = accion === 'verificar'
      ? await fetch(CERT_API + '?accion=verificar&codigo=' + encodeURIComponent(datos.codigo || ''))
      : await fetch(CERT_API, { method: 'POST', body: JSON.stringify(Object.assign({ accion }, datos)) }); // texto plano: evita la verificación previa de CORS
    return await r.json();
  } catch (e) {
    return { ok: false, red: true, error: 'No pudimos conectarnos con el servidor. Revisa tu internet e inténtalo de nuevo.' };
  }
}

async function comenzarExamen(nombre, correo, err, btn, etiqueta) {
  const cs = certStore();
  btn.disabled = true; btn.textContent = 'Preparando tu examen…';
  const r = await certReq('iniciar', { nombre, correo, acepta: true });
  btn.disabled = false; btn.textContent = etiqueta;
  cs.nombre = nombre; cs.correo = correo; save();
  if (!r.ok) { err.textContent = r.espera ? `Ya usaste tus 2 intentos. Podrás volver a intentarlo desde el ${fechaHora(r.proximo)}, hora de tu dispositivo.` : (r.error || 'No se pudo iniciar el examen.'); return; }
  delete cs.resultado;
  if (r.yaAprobado) { cs.resultado = { aprobado: true, puntaje: r.puntaje, total: r.total, nombre: r.nombre, codigo: r.codigo, fecha: r.fecha }; save(); renderResultado(cs.resultado); return; }
  cs.examen = { id: r.id, fin: r.fin, skew: r.ahora - Date.now(), intento: r.intento, de: r.de, preguntas: r.preguntas, resp: (cs.examen && cs.examen.id === r.id) ? cs.examen.resp : new Array(r.preguntas.length).fill(null), cur: 0 };
  save();
  track('constancia_iniciado', { intento: r.intento });
  renderExamen();
}

let examTimer = null;
function renderExamen() {

  document.body.classList.add('in-exam');
  const n = ex.preguntas.length;
  app.innerHTML = `
  <div class="exam-bar"><div class="wrap">
    <b>Examen final${ex.intento ? ` · Intento ${ex.intento} de ${ex.de || CERT.intentos}` : ''}</b>
    <span class="timer" id="timer" role="timer" aria-label="Tiempo restante">--:--</span>
    <span class="exam-count" id="exam-count"></span>

  </div></div>
  <main class="wrap exam-wrap">
    ${CERT_DEMO ? `<div class="demo-bar"><b>Vista previa</b><button type="button" id="demo-ok">Marcar respuestas correctas</button><button type="button" id="demo-39">Marcar 39 correctas</button></div>` : ''}
    <section class="block confirm" id="confirm" hidden>
      <div class="block-head"><div><span class="kicker">Confirmar</span><h2 id="confirm-title">¿Enviar tu examen?</h2></div></div>

    </section>

    <section class="block">
      <div class="block-head"><div><span class="kicker">Navegación</span><h2>Preguntas</h2></div><div class="legend"><span><i class="a"></i>Respondida</span><span><i></i>Sin responder</span></div></div>
      <div class="grid50" id="grid50">${ex.preguntas.map((_, i) => `<button type="button" data-q="${i}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join('')}</div>
    </section>
  </main>`;
  document.title = 'Examen final · Ruta IA Data Analyst 2027';
  const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  const restante = () => (ex.fin - (Date.now() + (ex.skew || 0))) / 1000;
  const cuenta = () => ex.resp.filter(x => x !== null).length;
  function pintar() {
    const i = ex.cur, p = ex.preguntas[i];
    document.getElementById('qcard').innerHTML = `
      <span class="qnum">Pregunta ${i + 1} de ${n}</span>
      <h2>${esc(p.t)}</h2>
      <div class="opts" role="radiogroup" aria-label="Alternativas">${p.o.map((o, k) => `<button class="opt" type="button" role="radio" aria-checked="${ex.resp[i] === k}" data-k="${k}"><span class="lt">${L[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="qnav"><button class="btn ghost" type="button" id="prev" ${i ? '' : 'disabled'}>← Anterior</button><button class="btn" type="button" id="next">${i < n - 1 ? 'Siguiente →' : 'Revisar y enviar'}</button></div>`;
    document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { ex.resp[i] = Number(b.dataset.k); save(); pintar(); }));
    document.getElementById('prev').addEventListener('click', () => { ex.cur--; save(); pintar(); scrollTo(0, 0); });
    document.getElementById('next').addEventListener('click', () => { if (i < n - 1) { ex.cur++; save(); pintar(); scrollTo(0, 0); } else pedirEnvio(); });
    document.querySelectorAll('#grid50 button').forEach((b, k) => { b.classList.toggle('ans', ex.resp[k] !== null); b.classList.toggle('cur', k === i); b.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    document.getElementById('exam-count').textContent = `Respondidas: ${cuenta()} de ${n}`;
  }
  function pedirEnvio() {
    const faltan = n - cuenta();
    document.getElementById('confirm-text').textContent = faltan ? `Te faltan ${faltan} pregunta${faltan === 1 ? '' : 's'} por responder. Las preguntas sin responder cuentan como incorrectas. Después de enviar no podrás cambiar tus respuestas.` : 'Respondiste las 50 preguntas. Después de enviar no podrás cambiar tus respuestas.';
    const c = document.getElementById('confirm'); c.hidden = false; c.scrollIntoView({ block: 'center' }); document.getElementById('do-send').focus();
  }
  let enviando = false;
  async function enviar(auto) {
    if (enviando) return; enviando = true;
    const btn = document.getElementById('do-send'), err = document.getElementById('send-err');

    const r = await certReq('enviar', { id: ex.id, respuestas: ex.resp });
    enviando = false;
    if (!r.ok) { if (btn) { btn.disabled = false; btn.textContent = 'Intentar enviar de nuevo'; } err.textContent = r.error || 'No se pudo enviar.'; if (!r.red) { delete cs.examen; save(); } return; }
    clearInterval(examTimer);
    cs.resultado = { aprobado: r.aprobado, puntaje: r.puntaje, total: r.total, nombre: r.nombre, codigo: r.codigo, fecha: r.fecha, proximo: r.proximo, restantes: r.restantes, aTiempo: r.aTiempo };
    delete cs.examen; save();
    track('constancia_enviado', { aprobado: r.aprobado ? 'si' : 'no', puntaje: r.puntaje });
    renderResultado(cs.resultado);
  }
  document.getElementById('ask-send').addEventListener('click', pedirEnvio);
  document.getElementById('cancel-send').addEventListener('click', () => { document.getElementById('confirm').hidden = true; });
  document.getElementById('do-send').addEventListener('click', () => enviar(false));
  document.getElementById('grid50').addEventListener('click', e => { const b = e.target.closest('button[data-q]'); if (!b) return; ex.cur = Number(b.dataset.q); save(); pintar(); document.getElementById('qcard').scrollIntoView({ block: 'start' }); });
  if (CERT_DEMO) {
    const fill = k => { const ok = demoServer.trampa(ex.id); ex.resp = ok.map((c, i) => i < k ? c : (c + 1) % 4); save(); pintar(); };
    document.getElementById('demo-ok').addEventListener('click', () => fill(50));
    document.getElementById('demo-39').addEventListener('click', () => fill(39));
  }
  clearInterval(examTimer);
  const tick = () => {
    const t = document.getElementById('timer');
    if (!t) { clearInterval(examTimer); return; }
    const s = restante();
    t.textContent = fmt(s);
    t.classList.toggle('low', s <= 600);
    if (s <= 0) { clearInterval(examTimer); enviar(true); }
  };
  tick(); examTimer = setInterval(tick, 1000);
  pintar();
}

async function dibujarCertificado(cv, r, verifUrl) {
  try { await document.fonts.ready; await Promise.all([document.fonts.load('800 80px Figtree'), document.fonts.load('500 30px Figtree'), document.fonts.load('500 24px "IBM Plex Mono"')]); } catch (e) {}
  const c = cv.getContext('2d'), W = cv.width, H = cv.height;
  const F = (w, s, f = 'Figtree') => `${w} ${s}px ${f}, "Segoe UI", system-ui, sans-serif`;
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
  // Banda lateral de marca
  c.fillStyle = '#0d2a3c'; c.fillRect(0, 0, 360, H);
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1;
  for (let x = 0; x <= 360; x += 40) { c.beginPath(); c.moveTo(x + .5, 0); c.lineTo(x + .5, H); c.stroke(); }
  for (let y = 0; y <= H; y += 40) { c.beginPath(); c.moveTo(0, y + .5); c.lineTo(360, y + .5); c.stroke(); }
  // Logotipo de la ruta (barras)
  c.save(); c.translate(84, 110); c.lineCap = 'round'; c.lineWidth = 16; c.strokeStyle = '#7cbbe0';
  [[0, 70, 36], [36, 70, 10], [72, 70, 46]].forEach(([x, y1, y2]) => { c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y2); c.stroke(); });
  c.fillStyle = '#5fd08d'; c.beginPath(); c.arc(112, 6, 12, 0, 7); c.fill(); c.restore();
  c.fillStyle = '#ffffff'; c.font = F(700, 34); c.fillText('Ruta', 84, 250); c.fillText('IA Data Analyst', 84, 292); c.fillStyle = '#7cbbe0'; c.fillText('2027', 84, 334);
  c.fillStyle = '#b9cdd8'; c.font = F(500, 22);
  [TOTAL_HORAS + ' de estudio', '10 módulos', 'Excel · SQL · Python', 'Power BI · IA generativa', 'Agentes · Ética de la IA'].forEach((t, i) => c.fillText(t, 84, 420 + i * 40));
  c.font = F(500, 18, '"IBM Plex Mono"'); c.fillStyle = '#7cbbe0'; c.fillText('CÓDIGO', 84, H - 150);
  c.fillStyle = '#ffffff'; c.font = F(500, 26, '"IBM Plex Mono"'); c.fillText(r.codigo, 84, H - 112);
  // Marco
  c.strokeStyle = '#d8e1e5'; c.lineWidth = 2; c.strokeRect(400, 40, W - 440, H - 80);
  const X = 470, MAXW = W - X - 110;
  // Sello del examen (arriba a la derecha)
  const sx = W - 190, sy = 175;
  c.fillStyle = '#e1f2e7'; c.beginPath(); c.arc(sx, sy, 82, 0, 7); c.fill();
  c.strokeStyle = '#1d7a46'; c.lineWidth = 3; c.beginPath(); c.arc(sx, sy, 70, 0, 7); c.stroke();
  c.textAlign = 'center'; c.fillStyle = '#1d7a46';
  c.font = F(500, 14, '"IBM Plex Mono"'); c.fillText('EXAMEN FINAL', sx, sy - 24);
  c.font = F(800, 40); c.fillText(`${r.puntaje}/${r.total}`, sx, sy + 16);
  c.font = F(500, 14, '"IBM Plex Mono"'); c.fillText('APROBADO', sx, sy + 42);
  c.textAlign = 'left';
  // Cuerpo: se calcula el alto para centrarlo entre la cabecera y el pie
  let size = 84; c.font = F(800, size);
  while (c.measureText(r.nombre).width > MAXW && size > 40) { size -= 2; c.font = F(800, size); }
  c.font = F(500, 30);
  const texto = `por completar la Ruta IA Data Analyst 2027, de ${TOTAL_HORAS} de estudio, y aprobar el examen final con ${r.puntaje} de ${r.total} respuestas correctas.`;
  const lineas = []; let linea = '';
  texto.split(' ').forEach(w => { const prueba = linea ? linea + ' ' + w : w; if (c.measureText(prueba).width > MAXW) { lineas.push(linea); linea = w; } else linea = prueba; });
  lineas.push(linea);
  const yPie = H - 220;
  const alto = 22 + 70 + 40 + 34 + size + 34 + 6 + 70 + (lineas.length - 1) * 46;
  let y = Math.max(150, 120 + (yPie - 80 - 120 - alto) / 2) + 22;
  c.fillStyle = '#1d5f86'; c.font = F(500, 22, '"IBM Plex Mono"'); c.fillText('CONSTANCIA DE FINALIZACIÓN', X, y);
  y += 110; c.fillStyle = '#5a6a73'; c.font = F(500, 30); c.fillText('Se otorga la presente constancia a', X, y);
  y += 34 + size; c.fillStyle = '#15222a'; c.font = F(800, size); c.fillText(r.nombre, X, y);
  y += 34; c.fillStyle = '#5fd08d'; c.fillRect(X, y, 120, 6);
  y += 76; c.fillStyle = '#15222a'; c.font = F(500, 30);
  lineas.forEach((l, i) => c.fillText(l, X, y + i * 46));
  // Pie: fecha y firma
  c.strokeStyle = '#d8e1e5'; c.lineWidth = 2; c.beginPath(); c.moveTo(X, yPie - 40); c.lineTo(W - 110 - 132 - 40, yPie - 40); c.stroke();
  c.fillStyle = '#5a6a73'; c.font = F(500, 20, '"IBM Plex Mono"'); c.fillText('FECHA', X, yPie); c.fillText('OTORGADO POR', X + 470, yPie);
  c.fillStyle = '#15222a'; c.font = F(600, 32); c.fillText(fechaLarga(r.fecha), X, yPie + 46); c.fillText('Alfredo Amez', X + 470, yPie + 46);
  c.fillStyle = '#5a6a73'; c.font = F(500, 22); c.fillText('Data Analyst · Creador de la ruta', X + 470, yPie + 80);
  // QR de verificación, discreto en la esquina inferior derecha
  try {
    const q = qrcode(0, 'M'); q.addData(verifUrl); q.make();
    const n = q.getModuleCount(), size = 132, cel = size / n, qx = W - 110 - size, qy = yPie - 30;
    c.fillStyle = '#ffffff'; c.fillRect(qx - 8, qy - 8, size + 16, size + 16);
    c.fillStyle = '#15222a';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(qx + k * cel, qy + r * cel, Math.ceil(cel), Math.ceil(cel));
    c.textAlign = 'center'; c.fillStyle = '#5a6a73'; c.font = F(500, 14, '"IBM Plex Mono"');
    c.fillText('ESCANEA PARA VERIFICAR', qx + size / 2, qy + size + 30);
    c.textAlign = 'left';
  } catch (e) {}
}

function route() {
  const h = location.hash.replace('#', '');
  const m = MODULES.find(x => 'modulo-' + x.id === h);
  clearInterval(examTimer);
  document.body.classList.remove('in-exam');
  if (h === 'modulo-0') renderModule0(); else if (h === 'modulo-11') renderModule11(); else if (h === 'constancia' || h === 'certificado') renderCertificado(); else if (h === 'apoyar') renderApoyar(); else if (/^verificar/.test(h)) renderVerificar(decodeURIComponent(h.split('/')[1] || '')); else if (m) renderModule(m); else renderOverview();
  currentModule = /^modulo-\d+$/.test(h) ? h.replace('modulo-', '') : (h === 'constancia' || h === 'certificado') ? 'constancia' : h === 'apoyar' ? 'apoyar' : /^verificar/.test(h) ? 'verificar' : 'inicio';
  if (m) { store.last = m.id; save(); }
  renderRail(h);
  Dati.onRoute(currentModule);
  window.scrollTo(0, 0);
  track('modulo_visto', { modulo_nombre: document.title });
  if (gaReady && routed) gtag('event', 'page_view', { page_title: document.title, page_location: location.origin + location.pathname + (currentModule === 'inicio' ? '' : 'modulo-' + currentModule), module_id: currentModule });
}

const ICON_PLAYC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>';

const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
function renderRail(h) {
  const last = MODULES.find(x => x.id === store.last);
  const items = [
    ['#inicio', 'Inicio', ICON_HOME, !h || h === 'inicio'],
    ['#modulo-0', 'Empieza', MOD_ICON[0], h === 'modulo-0'],
    ['#modulo-' + (last ? last.id : 1), last ? 'Continuar' : 'Módulo 1', ICON_PLAYC, /^modulo-([1-9]|10)$/.test(h)],
    ['#modulo-11', 'Meta', MOD_ICON[10], h === 'modulo-11'],
    ['#constancia', 'Constancia', ICON_CERT, h === 'constancia' || h === 'certificado' || /^verificar/.test(h)]
  ];
  document.getElementById('rail').innerHTML = items.map(([href, label, icon, on]) => `<a href="${href}" class="${on ? 'on' : ''}"><i>${icon}</i>${label}</a>`).join('') +
    `<a href="#apoyar" class="${h === 'apoyar' ? 'on' : ''}"><i>${ICON_HEART}</i>Apoyar</a><a href="${LINKEDIN}" target="_blank" rel="noopener"><i>${ICON_USER}</i>Contacto</a>`;
}
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value;
  if (!document.getElementById('cards')) { location.hash = 'inicio'; return; }
  renderCards();
});

/* ---------- Dati, la mascota ---------- */
const Dati = (() => {
  const TIPS = {
    inicio: ['¡Hola! Soy <b>Dati</b>, tu compañero en esta ruta. Te daré consejos mientras avanzas.', 'Empieza por el <b>Módulo 0</b>: en 5 minutos sabrás cómo funciona todo.', 'Usa el buscador de arriba para encontrar un tema, por ejemplo <b>SQL</b> o <b>Power BI</b>.'],
    0: ['Estudia <b>2 horas al día</b>: la constancia vale más que los maratones.', 'Tu avance se guarda en este navegador. Vuelve cuando quieras y sigue donde te quedaste.'],
    1: ['Antes de calcular, escribe tu <b>pregunta de negocio</b> en una sola línea.', 'Si la media y la mediana son muy distintas, busca <b>valores extremos</b>.'],
    2: ['Convierte tus datos en tabla con <b>Ctrl + T</b> antes de empezar.', 'Si un reporte se repite cada mes, hazlo con <b>Power Query</b> y solo actualiza.'],
    3: ['Escribe <b>una cláusula por línea</b>: tus consultas serán más fáciles de revisar.', 'Valida tu consulta con un <b>total que ya conozcas</b>.'],
    4: ['Pausa el video y <b>escribe el código tú</b>: así se aprende a programar.', 'Con pandas, empieza siempre con <b>df.head()</b> y <b>df.info()</b>.'],
    5: ['Usa <b>medidas DAX</b>, no columnas calculadas, para tus indicadores.', 'Pon arriba los <b>indicadores clave</b>: es lo primero que se mira.'],
    6: ['Un buen prompt tiene <b>contexto, tarea, formato y un ejemplo</b>.', 'La IA puede equivocarse con seguridad: <b>verifica las cifras</b>.'],
    7: ['Automatiza lo repetitivo y deja una <b>revisión humana</b> antes de enviar.', 'A un agente dale solo <b>permisos de lectura</b>.'],
    8: ['Toda cifra de un reporte debe poder <b>rastrearse hasta su fuente</b>.', 'Antes de pegar datos en una IA, <b>quita nombres y documentos</b>.'],
    9: ['Empieza tu presentación por la <b>conclusión</b>, no por la metodología.', 'Un buen proyecto de portafolio explica el <b>problema de negocio</b>, no solo el código.'],
    10: ['No necesitas un proyecto enorme: necesitas <b>una pregunta clara</b>.', 'Tu <b>README</b> es la portada de tu proyecto: cuídalo.'],
    apoyar: ['Seguir a Alfredo en <b>LinkedIn</b> es gratis y ayuda a que la ruta llegue a más personas.', 'Compartir la ruta con un amigo también es apoyar.'],
    constancia: ['Responde con calma: tienes <b>120 minutos</b> para 50 preguntas.', 'Antes del examen, repasa los <b>cuestionarios</b> de cada módulo.'],
    verificar: ['Escribe el código tal como aparece en la constancia, por ejemplo <b>RIA27-AB12-CD34</b>.'],
    11: ['¡Lo lograste! Comparte tu avance en <b>LinkedIn</b> y etiqueta a Alfredo.', 'Sigue practicando cada semana: el analista que se actualiza es el que más crece.']
  };
  const OK = ['¡Correcto!', '¡Así se hace!', '¡Bien! Vas muy bien.'];
  const MOTIVA = [
    'No tienes que ir rápido. Solo <b>no te detengas</b>.',
    'Cada tema que terminas te acerca a tu <b>primer trabajo en datos</b>.',
    'Ya sabes más que ayer. <b>Eso es avanzar.</b>',
    'Equivocarte también es aprender. <b>¡Sigue!</b>',
    'Lo que hoy te cuesta, mañana <b>te saldrá natural</b>.',
    'Pequeños avances diarios, <b>grandes resultados</b>.',
    'Tu yo del futuro <b>te va a agradecer</b> este esfuerzo.',
    'Si hoy solo avanzas un poco, <b>también cuenta</b>.',
    'Estás aprendiendo algo que <b>las empresas buscan</b>.',
    'La constancia le gana al talento. <b>Tú puedes.</b>'
  ];
  const HITOS = { 25: '¡Ya completaste el <b>25%</b> de la ruta! Buen ritmo.', 50: '¡Llegaste a la <b>mitad</b> de la ruta! Lo más difícil ya pasó.', 75: '¡<b>75%</b> completado! La meta ya se ve cerca.', 100: '¡Completaste <b>toda la ruta</b>! Estoy muy orgulloso de ti.' };
  const avance = () => { const t = MODULES.reduce((a, m) => a + parts(m).length, 0); const d = MODULES.reduce((a, m) => a + modProgress(m).n, 0); return Math.round(d / t * 100); };
  const motiva = () => MOTIVA[Math.floor(Math.random() * MOTIVA.length)];
  const BAD = ['Casi. Lee la explicación y sigue.', 'Tranquilo: de los errores también se aprende.'];
  const el = document.getElementById('dati'), bubble = document.getElementById('dati-bubble'), text = document.getElementById('dati-text');
  const st = () => { const d = (store.dati = store.dati || { off: false, greeted: false, seen: {} }); d.hitos = d.hitos || {}; return d; };
  let key = 'inicio', idx = 0, timer = null;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function say(html, { jump = false, hideAfter = 0 } = {}) {
    if (st().off) return;
    clearTimeout(timer);
    text.innerHTML = html;
    bubble.hidden = false;
    if (jump) { el.classList.remove('jump'); void el.offsetWidth; el.classList.add('jump'); }
    if (hideAfter) timer = setTimeout(() => { bubble.hidden = true; }, hideAfter);
  }
  // Cada tercer toque muestra una frase motivacional en lugar de un consejo
  function tip() { idx++; if (idx % 3 === 0) { say(motiva()); return; } const list = TIPS[key] || TIPS.inicio; say(list[idx % list.length]); }
  function hito() {
    const s = st(), p = avance();
    for (const h of [100, 75, 50, 25]) { if (p >= h && !s.hitos[h]) { [25, 50, 75, 100].filter(x => x <= h).forEach(x => s.hitos[x] = true); save(); setTimeout(() => say(HITOS[h], { jump: true, hideAfter: 8000 }), 3200); return true; } }
    return false;
  }
  // Una frase motivacional cada 15 minutos de estudio con la página visible
  let minutos = 0;
  setInterval(() => {
    if (document.hidden || st().off) return;
    minutos++;
    if (minutos % 15 === 0 && bubble.hidden) say(motiva(), { jump: true, hideAfter: 8000 });
  }, 60000);
  function setOff(off) {
    st().off = off; save();
    el.classList.toggle('off', off);
    bubble.hidden = true;
    document.getElementById('dati-btn').setAttribute('aria-label', off ? 'Mostrar a Dati, tu compañero de estudio' : 'Dati, tu compañero de estudio: ver un consejo');
    track(off ? 'mascota_ocultada' : 'mascota_mostrada');
  }
  document.getElementById('dati-btn').addEventListener('click', () => {
    if (st().off) { setOff(false); say('¡Volví! Aquí estaré con consejos mientras estudias.', { jump: true }); return; }
    if (bubble.hidden) tip(); else bubble.hidden = true;
  });
  document.getElementById('dati-next').addEventListener('click', tip);
  document.getElementById('dati-close').addEventListener('click', () => { bubble.hidden = true; });
  document.getElementById('dati-off').addEventListener('click', () => setOff(true));
  el.classList.toggle('off', !!st().off);
  return {
    onRoute(k) {
      key = k; idx = 0;
      const s = st();
      if (s.off) return;
      const ahora = Date.now(), antes = s.lastVisit || 0;
      s.lastVisit = ahora; save();
      if (!s.greeted) { s.greeted = true; save(); setTimeout(() => say(TIPS.inicio[0], { jump: true }), 900); return; }
      if (antes && ahora - antes > 2 * 864e5) { setTimeout(() => say('¡Qué bueno verte de nuevo! <b>Retomemos donde te quedaste.</b>', { jump: true, hideAfter: 8000 }), 900); return; }
      if (!s.seen[k]) { s.seen[k] = true; save(); setTimeout(() => say((TIPS[k] || TIPS.inicio)[0], { hideAfter: 9000 }), 1200); }
      else if (Math.random() < 0.35) setTimeout(() => say(motiva(), { hideAfter: 6000 }), 1200);
      else bubble.hidden = true;
    },
    react(type, n) {
      if (type === 'ok') say(pick(OK), { jump: true, hideAfter: 2500 });
      else if (type === 'bad') say(pick(BAD), { hideAfter: 3500 });
      else if (type === 'quiz') { if (n >= 7) hito(); say(n >= 7 ? `<b>${n}/10</b>. ¡Aprobaste el cuestionario! Ahora ve por la tarea aplicada.` : `<b>${n}/10</b>. Repasa los temas que fallaste y vuelve a intentarlo. ¡Tú puedes!`, { jump: n >= 7, hideAfter: 7000 }); }
      else if (type === 'tema') { say('¡Un tema menos! ' + motiva(), { jump: true, hideAfter: 5000 }); hito(); }
      else if (type === 'tarea') { say('¡Tarea completa! Compártela en <b>LinkedIn</b> y cuéntame cómo te fue.', { jump: true, hideAfter: 7000 }); hito(); }
    }
  };
})();
let routed = false;
addEventListener('hashchange', () => { routed = true; route(); });
route();
</script>
